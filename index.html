/* ───────── 신청 항목 만들기 ───────── */
function renderFields(form) {
  const box = document.getElementById('fieldsBox'); if (!box) return;
  const F = form._fields;
  if (!F.length) { box.innerHTML = '<div class="fb-empty">아직 항목이 없습니다. ‘항목 추가’로 희망 시간, 참석 여부처럼 받을 내용을 만드세요.</div>'; return; }
  box.innerHTML = F.map((f, i) => {
    const choice = f.type === 'one' || f.type === 'many';
    if (choice && !f.options.length) f.options = ['', ''];
    return `<div class="fcard" data-i="${i}">
      <div class="fcard-top">
        <input class="in" data-k="label" value="${esc(f.label)}" maxlength="80" placeholder="${i + 1}번 항목 이름 (예: 희망 시간)" aria-label="${i + 1}번 항목 이름">
        <select class="in" data-k="type" aria-label="${i + 1}번 항목 답 형식">${Object.entries(FTYPES).map(([k, l]) => `<option value="${k}" ${k === f.type ? 'selected' : ''}>${l}</option>`).join('')}</select>
        <div class="fcard-tools">
          <button type="button" class="icon-btn" data-act="fUp" data-i="${i}" aria-label="위로" ${i === 0 ? 'disabled' : ''}>↑</button>
          <button type="button" class="icon-btn" data-act="fDown" data-i="${i}" aria-label="아래로" ${i === F.length - 1 ? 'disabled' : ''}>↓</button>
          <button type="button" class="icon-btn" data-act="fDel" data-i="${i}" aria-label="항목 지우기">✕</button>
        </div>
      </div>
      ${choice ? `<div class="optlist">${f.options.map((o, j) => `<div class="optrow"><span class="mk ${f.type}"></span><input class="in" data-k="opt" value="${esc(o)}" maxlength="80" placeholder="보기 ${j + 1}" aria-label="보기 ${j + 1}"><button type="button" class="icon-btn" data-act="optDel" data-i="${i}" data-o="${j}" aria-label="보기 지우기" ${f.options.length <= 1 ? 'disabled' : ''}>✕</button></div>`).join('')}
        <div><button type="button" class="txt" data-act="optAdd" data-i="${i}">+ 보기 추가</button></div></div>` : ''}
      <div class="fcard-sub"><label class="req"><input type="checkbox" data-k="required" ${f.required ? 'checked' : ''}>꼭 답해야 함</label></div>
    </div>`;
  }).join('');
}
function syncFields(form) {
  if (!form || !form._fields) return;
  document.querySelectorAll('#fieldsBox .fcard').forEach(card => {
    const f = form._fields[+card.dataset.i]; if (!f) return;
    f.label = card.querySelector('[data-k=label]').value;
    f.type = card.querySelector('[data-k=type]').value;
    f.required = card.querySelector('[data-k=required]').checked;
    const opts = [...card.querySelectorAll('[data-k=opt]')].map(x => x.value);
    if (opts.length) f.options = opts;
  });
}

/* ───────── 신청서 ───────── */
function fieldInput(f, val) {
  const n = `q_${esc(f.id)}`, star = f.required ? '<span class="req-mark" aria-label="필수">*</span>' : '';
  if (f.type === 'one' || f.type === 'many') {
    const sel = Array.isArray(val) ? val : (val ? [val] : []);
    return `<fieldset class="f"><legend>${esc(f.label)}${star}${f.type === 'many' ? '<span class="qhint">여러 개 고를 수 있어요</span>' : ''}</legend><div class="opts">
      ${f.options.map(o => `<label><input type="${f.type === 'one' ? 'radio' : 'checkbox'}" name="${n}" value="${esc(o)}" ${sel.includes(o) ? 'checked' : ''}>${esc(o)}</label>`).join('')}</div></fieldset>`;
  }
  const v = esc(val ?? '');
  let input;
  if (f.type === 'long') input = `<textarea class="in" name="${n}" maxlength="2000">${v}</textarea>`;
  else if (f.type === 'number') input = `<input class="in" name="${n}" inputmode="decimal" value="${v}">`;
  else if (f.type === 'date') input = `<input class="in" name="${n}" type="date" value="${v}">`;
  else input = `<input class="in" name="${n}" maxlength="300" value="${v}">`;
  return `<label class="f"><span>${esc(f.label)}${star}</span>${input}</label>`;
}
function openApplyForm(post) {
  const fields = applyFields(post.extra);
  const prev = state.myApplies[post.id];
  openDialog(`<form id="applyForm" novalidate>${dlgHead(prev ? '내 신청 고치기' : '신청하기', esc(post.title))}
    <div class="dlg-body"><div id="formMsg"></div>${fields.map(f => fieldInput(f, prev ? prev[f.id] : '')).join('')}
    <p class="meta" style="margin:0">이름(${esc(state.me.name)})과 소속은 자동으로 함께 접수됩니다. 신청 내용은 올린 선생님과 관리자만 봅니다.</p></div>
    <div class="dlg-foot"><button type="button" class="btn line" data-act="close">닫기</button><button class="btn primary" type="submit">${prev ? '고쳐서 신청' : '신청하기'}</button></div></form>`);
  document.getElementById('applyForm').addEventListener('submit', async e => {
    e.preventDefault();
    const fd = new FormData(e.target), answers = {};
    for (const f of fields) {
      const n = `q_${f.id}`;
      const v = f.type === 'many' ? fd.getAll(n) : String(fd.get(n) ?? '').trim();
      if (f.required && (f.type === 'many' ? !v.length : !v)) return formMsg(f.type === 'one' || f.type === 'many' ? `‘${f.label}’에서 골라 주세요.` : `‘${f.label}’ 항목을 입력해 주세요.`);
      if (v && f.type === 'number' && isNaN(Number(String(v).replace(/,/g, '')))) return formMsg(`‘${f.label}’에는 숫자만 입력해 주세요.`);
      answers[f.id] = v;
    }
    const b = e.target.querySelector('[type=submit]'); b.disabled = true;
    try { await doApply(post, answers); closeDialog(); } catch (err) { formMsg(err.message); b.disabled = false; }
  });
}
async function doApply(post, answers) {
  const r = await api('apply', { postId: post.id, answers });
  if (!r.updated && canEdit(post)) state.applyCounts[post.id] = (state.applyCounts[post.id] || 0) + 1;
  if (r.full) state.applyFull[post.id] = true;
  state.myApplies[post.id] = r.answers;
  renderList(); toast(r.updated ? '신청 내용을 고쳤습니다.' : '신청했습니다.');
}

function closeMenu() { document.querySelectorAll('.pop').forEach(p => p.remove()); document.querySelectorAll('[data-act=menu]').forEach(b => b.setAttribute('aria-expanded', 'false')); }

/* ───────── 클릭 처리 ───────── */
document.addEventListener('click', async (ev) => {
  const t = ev.target.closest('[data-act]');
  if (!ev.target.closest('.menu-wrap')) closeMenu();
  if (!t) return;
  const act = t.dataset.act, id = t.dataset.id;
  const post = id ? state.posts.find(p => p.id === id) : null;
  try {
    switch (act) {
      case 'pwEye': {
        const inp = t.parentElement.querySelector('input'); const show = inp.type === 'password';
        inp.type = show ? 'text' : 'password'; t.textContent = show ? '숨기기' : '보기'; inp.focus(); break;
      }
      case 'roomPick': {
        state.room.id = id; state.room.day = null; renderRoom(document.getElementById('list')); break;
      }
      case 'roomMonth': {
        const R = state.room, step = +t.dataset.step;
        if (step === 0) { R.month = todayStr().slice(0, 7); R.day = todayStr(); }
        else { const [y, m] = R.month.split('-').map(Number); const d = new Date(y, m - 1 + step, 1); R.month = ymd(d).slice(0, 7); R.day = null; }
        await loadRoomMonth(); renderRoom(document.getElementById('list')); break;
      }
      case 'roomDay': {
        const R = state.room, ds = t.dataset.date;
        if (ds.slice(0, 7) !== R.month) { R.month = ds.slice(0, 7); await loadRoomMonth(); }
        R.day = ds; renderRoom(document.getElementById('list'));
        if (window.innerWidth <= 1100) document.getElementById('dayPanel')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
        break;
      }
      case 'bookCancel': {
        const data = monthData(), b = data && data.bookings.find(x => x.id === id);
        if (!b || !confirm(`${b.mine ? '' : b.name + ' 선생님의 '}예약을 취소할까요?\n${b.purpose}`)) return;
        await api('cancelBooking', { id });
        data.bookings = data.bookings.filter(x => x.id !== id);
        renderRoom(document.getElementById('list')); toast('예약을 취소했습니다.'); break;
      }
      case 'roomEdit': roomForm(state.rooms.find(r => r.id === id)); break;
      case 'roomDel': {
        const r = state.rooms.find(x => x.id === id);
        if (!r || !confirm(`‘${r.name}’을(를) 지울까요?\n이 실의 예약도 모두 지워집니다. 잠시 쉬게 하려면 ‘고치기’에서 ‘잠시 예약 받지 않기’를 쓰세요.`)) return;
        await api('roomDelete', { id });
        state.rooms = state.rooms.filter(x => x.id !== id); state.room.cache = {};
        renderPortal(); toast('지웠습니다.'); break;
      }
      case 'slotPreset': {
        const f = document.getElementById('roomForm');
        f._slots = SLOT_PRESETS[t.dataset.p].map(([label, time]) => ({ label, time })); renderSlotRows(f); break;
      }
      case 'slotAdd': { const f = document.getElementById('roomForm'); syncSlotRows(f); f._slots.push({ label: '', time: '' }); renderSlotRows(f); document.querySelector('#slotRows .slotrow:last-child input')?.focus(); break; }
      case 'slotDel': { const f = document.getElementById('roomForm'); syncSlotRows(f); f._slots.splice(+t.dataset.i, 1); renderSlotRows(f); break; }
      case 'planTab': await loadPlan(t.dataset.gid); break;
      case 'planReload': await loadPlan(state.plan.gid, true); toast('시트에서 새로 불러왔습니다.'); break;
      case 'planToday': if (!scrollToToday()) toast('이 탭에서 오늘 날짜를 찾지 못했습니다.'); break;
      case 'planCfg': if (!state.plan.data) { try { state.plan.data = await api('planGet', {}); } catch (e) { } } planCfgDialog(); break;
      case 'planUnlink': {
        if (!confirm('업무계획 시트 연결을 끊을까요? 시트 자체는 그대로 남습니다.')) return;
        await api('planSet', { url: '' }); closeDialog(); state.plan = { gid: null, data: null, error: null, loading: false }; renderPortal(); toast('연결을 끊었습니다.'); break;
      }
      case 'gateTab': state.gateTab = t.dataset.tab; renderGate(); break;
      case 'toGate': state.gateTab = 'login'; renderGate(); break;
      case 'menu': {

    savePost(r, me) {

      const np = { id: nid(), board: p.board, title: p.title, body: p.body, url: p.url, extra: p.extra, authorId: me.id, authorName: me.name, createdAt: now, updatedAt: now };

    deletePost(r) { const i = posts.findIndex(p => p.id === r.id); posts.splice(i, 1); for (let j = tallyData.length - 1; j >= 0; j--) if (tallyData[j].postId === r.id) tallyData.splice(j, 1); for (let j = applies.length - 1; j >= 0; j--) if (applies[j].postId === r.id) applies.splice(j, 1); return true; },
    apply(r, me) {

    applicants(r, me) {

      return { fields: fieldsOf(p.extra), list: applies.filter(a => a.postId === r.postId).map(a => ({ name: a.userName, dept: (users.find(u => u.id === a.userId) || {}).dept || '', answers: answers(a.memo), createdAt: a.createdAt })) };
    },
    roomSave(r, me) {

      if (!slots.length) return fail('INVALID', '예약 시간을 하나 이상 만들어 주세요.');

    book(r, me) {

      const out = r.slots.map(sl => { const b = { id: nid(), roomId: room.id, date: r.date, slot: sl, userId: me.id, userName: me.name, dept: me.dept, purpose: r.purpose.trim() }; bookings.push(b); return bOut(b, me); });

/* ───────── 실 예약 ─────────
   실 카드 → 그 실의 월 달력(예약자 표시) → 날짜를 누르면 오른쪽 패널에서 시간 고르고 예약 */
const pad2 = (n) => String(n).padStart(2, '0');

  period: [['1교시', '09:00~09:40'], ['2교시', '09:50~10:30'], ['3교시', '10:40~11:20'], ['4교시', '11:30~12:10'], ['점심시간', '12:10~13:00'], ['5교시', '13:00~13:40'], ['6교시', '13:50~14:30'], ['방과 후', '14:40~16:30']],

function activeRooms() { return state.rooms.filter(r => !r.opts.off); }

function monthKey() { return `${state.room.id}|${state.room.month}`; }

async function loadRoomMonth(force) {
  const R = state.room, key = monthKey();
  if (!force && R.cache[key]) return;
  R.loading = true; R.error = null;
  try { R.cache[key] = await api('roomMonth', { roomId: R.id, month: R.month }); }
  catch (e) { R.error = e.message; }
  R.loading = false;
}

function renderRoom(el) {
  const R = state.room, rooms = activeRooms(), isAdmin = state.me.role === 'admin';
  if (!rooms.length) {
    el.innerHTML = `<div class="empty"><b>예약할 수 있는 실이 아직 없습니다</b>${isAdmin ? '관리 메뉴의 ‘실 관리’에서 시청각실, 과학실처럼 예약 받을 실을 등록해 주세요.<br><button class="btn line" data-act="nav" data-view="roomcfg">실 관리로 가기</button>' : '관리자가 실을 등록하면 여기에서 예약할 수 있습니다.'}</div>`;
    return;
  }
  if (!rooms.some(r => r.id === R.id)) { R.id = rooms[0].id; R.day = null; }
  if (!R.month) R.month = todayStr().slice(0, 7);
  const room = curRoom();
  const data = monthData();
  if (!data && !R.error) {
    el.innerHTML = roomCards(rooms) + '<p class="meta">예약 현황을 불러오는 중…</p>';
    loadRoomMonth().then(() => { if (state.view === 'room') renderRoom(document.getElementById('list')); });
    return;
  }
  el.innerHTML = roomCards(rooms) + `<div class="rv" style="--rc:${room.color}">
      <section class="card cal">${calendarHtml(room, data)}</section>
      <aside class="card dp" id="dayPanel">${dayPanelHtml(room, data)}</aside>
    </div>`;
  bindBookForm();   // 예약 폼 연결은 여기 한 곳에서만(두 번 연결되면 예약이 두 번 들어감)
}
function roomCards(rooms) {
  const today = todayStr(), data = monthData();
  return `<div class="rooms" role="toolbar" aria-label="실 고르기">${rooms.map(r => {
    const n = r.id === state.room.id && data ? data.bookings.filter(b => b.date === today).length : null;
    return `<button class="rcard" style="--rc:${r.color}" data-act="roomPick" data-id="${r.id}" aria-pressed="${r.id === state.room.id}">
      <span class="ri">${ic('door')}</span>
      <span style="min-width:0"><b>${esc(r.name)}</b><small>${esc(r.place || '위치 미입력')}${r.desc ? ` · ${esc(r.desc)}` : ''}</small>
      ${n !== null ? `<span class="rtoday">오늘 예약 ${n}건 / ${r.slots.length}</span>` : ''}</span></button>`;
  }).join('')}</div>`;
}
function calendarHtml(room, data) {
  const R = state.room, [y, m] = R.month.split('-').map(Number);
  const first = new Date(y, m - 1, 1), start = new Date(first); start.setDate(1 - first.getDay());
  const last = new Date(y, m, 0);
  const weeks = Math.ceil((first.getDay() + last.getDate()) / 7);
  const today = todayStr();
  const byDate = {};
  (data ? data.bookings : []).forEach(b => (byDate[b.date] = byDate[b.date] || []).push(b));
  const order = Object.fromEntries(room.slots.map((sl, i) => [sl.id, i]));
  const label = Object.fromEntries(room.slots.map(sl => [sl.id, sl.label]));
  let cells = WD.map((w, i) => `<div class="wd ${i === 0 ? 'sun' : i === 6 ? 'sat' : ''}">${w}</div>`).join('');
  for (let i = 0; i < weeks * 7; i++) {
    const d = new Date(start); d.setDate(start.getDate() + i);
    const ds = ymd(d), out = d.getMonth() !== m - 1, dow = d.getDay();
    const list = (byDate[ds] || []).sort((a, b) => (order[a.slot] ?? 99) - (order[b.slot] ?? 99));
    const past = ds < today, closedDay = !room.opts.weekend && (dow === 0 || dow === 6);
    const free = !out && !past && !closedDay ? room.slots.length - list.length : 0;
    const shown = list.slice(0, 3);
    cells += `<button class="day ${out ? 'out' : ''} ${past ? 'past' : ''} ${ds === today ? 'today' : ''} ${ds === R.day ? 'sel' : ''} ${dow === 0 ? 'sun' : dow === 6 ? 'sat' : ''}" data-act="roomDay" data-date="${ds}" aria-label="${d.getMonth() + 1}월 ${d.getDate()}일 예약 ${list.length}건">
      <span class="dn"><span>${d.getDate()}</span>${free && list.length ? `<em class="free">${free}칸 남음</em>` : ''}</span>
      ${shown.map(b => `<span class="bk ${b.mine ? 'mine' : ''}" title="${esc(label[b.slot] || '')} ${esc(b.name)} · ${esc(b.purpose)}">${esc(label[b.slot] || '')} ${esc(b.name)}</span>`).join('')}
      ${list.length > 3 ? `<span class="bk more">외 ${list.length - 3}건</span>` : ''}
    </button>`;
  }
  return `<div class="cal-head">
      <button class="icon-btn" data-act="roomMonth" data-step="-1" aria-label="지난달">‹</button>
      <h2>${y}년 ${m}월</h2>
      <button class="icon-btn" data-act="roomMonth" data-step="1" aria-label="다음 달">›</button>
      <button class="btn sm line" data-act="roomMonth" data-step="0">오늘</button>
      <span class="room-name"><i></i>${esc(room.name)}${R.loading ? ' · 불러오는 중…' : ''}</span>
    </div>
    ${R.error ? `<div class="msg err">${esc(R.error)}</div>` : ''}
    <div class="cal-grid">${cells}</div>
    <div class="cal-legend"><span><i></i>예약</span><span><i class="m"></i>내 예약</span><span>날짜를 누르면 시간별 예약 현황과 예약 창이 열립니다</span></div>`;
}
function dayPanelHtml(room, data) {
  const R = state.room;
  if (!R.day) return `<div class="dp-empty">${ic('calendar')}<br>달력에서 날짜를 누르면<br>시간별 예약 현황이 여기에 나옵니다.</div>`;
  const d = new Date(R.day + 'T00:00:00'), dow = d.getDay(), today = todayStr();
  const list = (data ? data.bookings : []).filter(b => b.date === R.day);
  const by = Object.fromEntries(list.map(b => [b.slot, b]));
  const past = R.day < today;
  const weekendNo = !room.opts.weekend && (dow === 0 || dow === 6);
  const limit = new Date(); limit.setHours(0, 0, 0, 0); limit.setDate(limit.getDate() + room.opts.maxDays);
  const tooFar = d > limit;
  const why = past ? '지난 날짜라 예약할 수 없습니다.' : weekendNo ? '주말에는 예약을 받지 않습니다.' : tooFar ? `${room.opts.maxDays}일 뒤까지만 예약할 수 있습니다.` : '';
  const slots = room.slots.map(sl => {
    const b = by[sl.id];
    const time = `<span class="sl"><b>${esc(sl.label)}</b>${sl.time ? `<small>${esc(sl.time)}</small>` : ''}</span>`;
    if (b) return `<div class="slot booked ${b.mine ? 'mine' : ''}">${time}<span class="who"><b>${esc(b.name)}</b>${b.dept ? `<span>${esc(b.dept)}</span>` : ''}<p>${esc(b.purpose)}</p></span>
      ${b.canCancel ? `<button class="txt" data-act="bookCancel" data-id="${b.id}">${b.mine ? '취소' : '관리자 취소'}</button>` : '<span></span>'}</div>`;
    if (why) return `<div class="slot na">${time}<span>비어 있음</span><span></span></div>`;
    return `<label class="slot free">${time}<span class="tag2">예약 가능</span><input type="checkbox" name="slot" value="${esc(sl.id)}" aria-label="${esc(sl.label)} 선택"></label>`;
  }).join('');
  const freeN = room.slots.filter(sl => !by[sl.id]).length;
  return `<h3>${d.getMonth() + 1}월 ${d.getDate()}일 (${WD[dow]})</h3>
    <p class="meta">${esc(room.name)}${room.place ? ` · ${esc(room.place)}` : ''} · 예약 ${list.length}건, 빈 시간 ${freeN}개</p>
    ${why ? `<div class="msg" style="background:var(--sunken);color:var(--ink-2)">${why}</div>` : ''}
    <form id="bookForm" novalidate>
      <div class="slots">${slots}</div>
      ${!why && freeN ? `<div class="bookform">
        <label class="f" style="margin-bottom:0"><span>사용 목적</span><input class="in" name="purpose" maxlength="100" placeholder="예) 3-2 과학 실험, 학년 협의회"></label>
        <button class="btn primary" type="submit" id="bookBtn">시간을 골라 주세요</button>
      </div>` : ''}
    </form>`;
}
function bindBookForm() {
  const f = document.getElementById('bookForm'); if (!f) return;
  const upd = () => {
    const n = f.querySelectorAll('input[name=slot]:checked').length, b = document.getElementById('bookBtn');
    if (b) b.textContent = n ? `${n}개 시간 예약하기` : '시간을 골라 주세요';
  };
  f.addEventListener('change', upd);
  f.addEventListener('submit', async (e) => {
    e.preventDefault();
    const slots = [...f.querySelectorAll('input[name=slot]:checked')].map(x => x.value);
    const purpose = (f.purpose?.value || '').trim();
    if (!slots.length) return toast('예약할 시간을 골라 주세요.');
    if (!purpose) { f.purpose.focus(); return toast('사용 목적을 적어 주세요.'); }
    const b = document.getElementById('bookBtn'); b.disabled = true; b.textContent = '예약하는 중…';
    try {
      const r = await api('book', { roomId: state.room.id, date: state.room.day, slots, purpose });
      monthData().bookings.push(...r.bookings);
      renderRoom(document.getElementById('list'));
      toast(`${r.bookings.length}개 시간을 예약했습니다.`);
    } catch (err) {
      toast(err.message); b.disabled = false; upd();
      if (/이미 예약/.test(err.message)) { await loadRoomMonth(true); renderRoom(document.getElementById('list')); }
    }
  });
}

/* 실 관리(관리자) */
function renderRoomCfg(el) {
  const rooms = state.rooms;
  if (!rooms.length) { el.innerHTML = `<div class="empty"><b>등록된 실이 없습니다</b>시청각실, 과학실, 컴퓨터실처럼 예약 받을 실을 등록해 주세요.<br><button class="btn line" data-act="new">${ic('plus')}실 등록</button></div>`; return; }
  el.innerHTML = `<div class="rcfg">${rooms.map(r => `<div class="card rrow" style="--rc:${r.color}">
      <span class="ri">${ic('door')}</span>
      <div style="min-width:0"><b>${esc(r.name)}</b>${r.opts.off ? '<span class="off">예약 중지</span>' : ''}
        <div class="meta"><span>${esc(r.place || '위치 미입력')}</span><span>시간 ${r.slots.length}개 (${esc(r.slots.slice(0, 3).map(x => x.label).join(', '))}${r.slots.length > 3 ? ' …' : ''})</span><span>${r.opts.weekend ? '주말 포함' : '평일만'}</span><span>${r.opts.maxDays}일 뒤까지</span></div>
        ${r.desc ? `<div class="meta" style="margin-top:2px">${esc(r.desc)}</div>` : ''}</div>
      <div class="own"><button class="txt" data-act="roomEdit" data-id="${r.id}">고치기</button><button class="txt" data-act="roomDel" data-id="${r.id}">지우기</button></div>
    </div>`).join('')}</div>`;
}
function roomForm(room) {
  const r = room || { name: '', place: '', desc: '', color: ROOM_COLORS[state.rooms.length % ROOM_COLORS.length], slots: SLOT_PRESETS.period.map(([label, time]) => ({ label, time })), opts: { weekend: false, maxDays: 60, off: false } };
  openDialog(`<form id="roomForm" novalidate>${dlgHead(room ? '실 고치기' : '실 등록')}
    <div class="dlg-body"><div id="formMsg"></div>
      <div class="row2"><label class="f"><span>실 이름</span><input class="in" name="name" maxlength="30" value="${esc(r.name)}" placeholder="시청각실"></label>
        <label class="f"><span>위치<small>선택</small></span><input class="in" name="place" maxlength="40" value="${esc(r.place)}" placeholder="본관 3층"></label></div>
      <label class="f"><span>안내<small>선택</small></span><input class="in" name="desc" maxlength="200" value="${esc(r.desc)}" placeholder="빔프로젝터, 60석"></label>
      <fieldset class="f"><legend>색</legend><div class="swatches">${ROOM_COLORS.map(c => `<label style="--sw:${c}"><input type="radio" name="color" value="${c}" ${c === r.color ? 'checked' : ''} aria-label="색 ${c}"></label>`).join('')}</div></fieldset>
      <div class="f" style="margin-bottom:16px"><span class="flabel">예약 시간<small>한 칸씩 예약됩니다</small></span>
        <div class="preset" style="margin:0 0 10px"><button type="button" class="btn sm line" data-act="slotPreset" data-p="period">교시 단위로 채우기</button><button type="button" class="btn sm line" data-act="slotPreset" data-p="hour">1시간 단위로 채우기</button></div>
        <div class="slotrows" id="slotRows"></div>
        <button type="button" class="txt" data-act="slotAdd">+ 시간 추가</button></div>
      <div class="row2"><label class="f"><span>며칠 뒤까지 예약</span><input class="in" name="maxDays" type="number" min="1" max="365" value="${r.opts.maxDays}"></label><div></div></div>
      <label class="check" style="margin-top:0"><input type="checkbox" name="weekend" ${r.opts.weekend ? 'checked' : ''}>주말(토·일)에도 예약 받기</label>
      <label class="check"><input type="checkbox" name="off" ${r.opts.off ? 'checked' : ''}>잠시 예약 받지 않기 <span class="qhint">실 예약 메뉴에서 숨겨집니다</span></label>
    </div>
    <div class="dlg-foot"><button type="button" class="btn line" data-act="close">닫기</button><button class="btn primary" type="submit">${room ? '저장' : '등록'}</button></div></form>`);
  const form = document.getElementById('roomForm');
  form._slots = r.slots.map(x => ({ ...x }));
  renderSlotRows(form);
  form.addEventListener('submit', async (e) => {
    e.preventDefault(); syncSlotRows(form);
    const fd = new FormData(form);
    const slots = form._slots.map(x => ({ ...x, label: x.label.trim(), time: x.time.trim() })).filter(x => x.label);
    if (!String(fd.get('name') || '').trim()) return formMsg('실 이름을 입력해 주세요.');
    if (!slots.length) return formMsg('예약 시간을 하나 이상 만들어 주세요.');
    const b = form.querySelector('[type=submit]'); b.disabled = true;
    try {
      const saved = await api('roomSave', { room: { id: room?.id, name: fd.get('name'), place: fd.get('place'), desc: fd.get('desc'), color: fd.get('color'), slots,
        order: room ? room.order : state.rooms.length, opts: { weekend: !!fd.get('weekend'), off: !!fd.get('off'), maxDays: fd.get('maxDays') } } });
      const i = state.rooms.findIndex(x => x.id === saved.id);
      if (i >= 0) state.rooms[i] = saved; else state.rooms.push(saved);
      closeDialog(); renderPortal(); toast(room ? '저장했습니다.' : `‘${saved.name}’을(를) 등록했습니다.`);
    } catch (err) { formMsg(err.message); b.disabled = false; }
  });
}
function renderSlotRows(form) {
  document.getElementById('slotRows').innerHTML = form._slots.map((x, i) => `<div class="slotrow" data-i="${i}">
    <input class="in" data-k="label" value="${esc(x.label)}" maxlength="20" placeholder="이름 (예: 1교시)" aria-label="${i + 1}번 시간 이름">
    <input class="in" data-k="time" value="${esc(x.time || '')}" maxlength="30" placeholder="시각 (예: 09:00~09:40)" aria-label="${i + 1}번 시각">
    <button type="button" class="icon-btn" data-act="slotDel" data-i="${i}" aria-label="이 시간 지우기">✕</button></div>`).join('') || '<p class="meta">시간이 없습니다. 위의 버튼으로 채우거나 시간을 추가하세요.</p>';
}
function syncSlotRows(form) {
  document.querySelectorAll('#slotRows .slotrow').forEach(row => {
    const x = form._slots[+row.dataset.i]; if (!x) return;
    x.label = row.querySelector('[data-k=label]').value; x.time = row.querySelector('[data-k=time]').value;
  });
}

/* ───────── 업무계획 ─────────
   서버가 시트를 값·병합·색·굵기·열 너비 그대로 보내 주면, 여기서 표로 그립니다. 시트를 고치지는 않습니다. */
async function loadPlan(gid, fresh) {
  const P = state.plan;
  P.loading = true; P.error = null;
  if (document.getElementById('planBox')) renderPlan(document.getElementById('list'));
  try { P.data = await api('planGet', { gid: gid || undefined, fresh: fresh ? 1 : undefined }); P.gid = P.data.gid; }
  catch (e) { P.error = e.message; }
  P.loading = false;
  const el = document.getElementById('list');
  if (state.view === 'plan' && el) { renderPlan(el); scrollToToday(); }
}
function todayPatterns() {
  const d = new Date(), M = d.getMonth() + 1, D = d.getDate();
  return [new RegExp(`(^|[^0-9])${M}\\s*[./]\\s*${D}(?![0-9])`), new RegExp(`(^|[^0-9])${M}\\s*월\\s*${D}\\s*일`)];
}
function linkify(t) { return esc(t).replace(/https?:\/\/[^\s<]+/g, u => `<a href="${u}" target="_blank" rel="noopener">${u}</a>`); }

function planTable(g) {
  if (!g.v.length) return '<div class="plan-empty">이 탭은 비어 있습니다.</div>';
  const hr = new Set(g.hr), hc = new Set(g.hc);
  const cover = new Set(), span = {};
  g.m.forEach(([r, c, rs, cs]) => {
    for (let i = r; i < r + rs; i++) for (let j = c; j < c + cs; j++) if (i !== r || j !== c) cover.add(i + ',' + j);
    let vr = 0, vc = 0;
    for (let i = r; i < r + rs && i < g.v.length; i++) if (!hr.has(i)) vr++;
    for (let j = c; j < c + cs; j++) if (!hc.has(j)) vc++;
    span[r + ',' + c] = [vr, vc];
  });
  const pats = todayPatterns();
  const cols = g.w.map((w, c) => hc.has(c) ? '' : `<col style="width:${Math.max(24, w)}px">`).join('');
  const total = g.w.reduce((a, w, c) => a + (hc.has(c) ? 0 : Math.max(24, w)), 0);
  const row = (r) => {
    if (hr.has(r)) return '';
    const cells = g.v[r].map((val, c) => {
      if (hc.has(c) || cover.has(r + ',' + c)) return '';
      const sp = span[r + ',' + c];
      if (sp && (!sp[0] || !sp[1])) return '';
      const st = g.st[g.s[r][c]] || {};
      const css = [st.b && `background:${st.b}`, st.c && `color:${st.c}`, st.w && 'font-weight:700', st.a === 'c' && 'text-align:center', st.a === 'r' && 'text-align:right',
        st.z && `font-size:${(st.z * 1.333).toFixed(1)}px`, st.t && 'vertical-align:top'].filter(Boolean).join(';');
      const today = val && pats.some(p => p.test(val));
      return `<td${sp && sp[0] > 1 ? ` rowspan="${sp[0]}"` : ''}${sp && sp[1] > 1 ? ` colspan="${sp[1]}"` : ''}${css ? ` style="${css}"` : ''}${today ? ' class="today"' : ''}>${linkify(val)}</td>`;
    }).join('');
    return `<tr>${cells}</tr>`;
  };
  const idx = g.v.map((_, r) => r);
  const head = idx.slice(0, g.fr).map(row).join(''), body = idx.slice(g.fr).map(row).join('');
  return `<table class="plan" style="width:${total}px"><colgroup>${cols}</colgroup>${head ? `<thead>${head}</thead>` : ''}<tbody>${body}</tbody></table>`;
}

function renderPlan(el) {
  const P = state.plan, isAdmin = state.me.role === 'admin';
  if (!P.data && !P.loading && !P.error) { loadPlan(null); return; }
  if (P.error && !P.data) { el.innerHTML = `<div id="planBox"><div class="msg err">${esc(P.error)}</div>${isAdmin ? '<button class="btn line" data-act="planCfg">시트 연결 설정</button>' : ''}</div>`; return; }
  if (!P.data) { el.innerHTML = '<div id="planBox"><p class="meta">업무계획 시트를 불러오는 중…</p></div>'; return; }
  const d = P.data;
  if (!d.connected) {
    el.innerHTML = `<div id="planBox" class="empty"><b>아직 연결된 업무계획 시트가 없습니다</b>${isAdmin ? '오른쪽 위 ‘시트 연결 설정’에서 학교 업무계획 시트 주소를 넣어 주세요.<br><button class="btn line" data-act="planCfg">시트 연결 설정</button>' : '관리자가 시트를 연결하면 여기에서 볼 수 있습니다.'}</div>`;
    return;
  }
  const at = new Date(d.at);
  el.innerHTML = `<div id="planBox">
    <div class="plan-bar">
      <div class="plan-tabs" role="toolbar" aria-label="시트 탭">${d.tabs.map(t => `<button data-act="planTab" data-gid="${esc(t.gid)}" aria-pressed="${t.gid === d.gid}">${esc(t.name)}</button>`).join('')}</div>
      <div class="plan-acts">
        <button class="btn sm line" data-act="planToday">오늘 위치</button>
        <button class="btn sm line" data-act="planReload" ${P.loading ? 'disabled' : ''}>${P.loading ? '불러오는 중…' : '새로고침'}</button>
        <a class="btn sm line" href="${esc(safeUrl(d.url))}" target="_blank" rel="noopener">${ic('out')}시트에서 보기</a>
      </div>
    </div>
    <div class="plan-meta">${esc(d.title)} · ${at.getHours()}시 ${String(at.getMinutes()).padStart(2, '0')}분 기준${d.auto ? ' · 이번 주(이번 달) 탭을 자동으로 열었습니다' : ''}${P.error ? ` · <span style="color:#b4282e">${esc(P.error)}</span>` : ''}</div>
    <div class="plan-wrap" id="planWrap">${planTable(d.grid)}</div>
  </div>`;
  document.querySelector('.plan-tabs [aria-pressed="true"]')?.scrollIntoView({ block: 'nearest', inline: 'center' });
}
function scrollToToday() {
  const td = document.querySelector('#planWrap td.today'), wrap = document.getElementById('planWrap');
  if (!td || !wrap) return false;
  wrap.scrollTop = Math.max(0, td.offsetTop - wrap.clientHeight / 3);
  wrap.scrollLeft = Math.max(0, td.offsetLeft - 60);
  return true;
}
async function planCfgDialog() {
  const P = state.plan;
  const email = (P.data && P.data.serviceEmail) || '';
  openDialog(`<form id="planForm" novalidate>${dlgHead('업무계획 시트 연결')}
    <div class="dlg-body"><div id="formMsg"></div>
      <label class="f"><span>구글 시트 주소</span><input class="in" name="url" type="url" placeholder="https://docs.google.com/spreadsheets/d/…" value="${P.data && P.data.connected ? esc(P.data.url) : ''}"></label>
      <p class="hint" style="margin:0 0 12px">포털을 배포한 구글 계정이 이 시트를 볼 수 있어야 합니다. 시트의 <b>공유</b>에서 ${email ? `<b>${esc(email)}</b>` : '포털 운영 계정'}을 <b>뷰어</b>로 추가해 주세요. 같은 계정으로 만든 시트라면 그대로 연결됩니다.</p>
      <p class="hint" style="margin:0">주소에 특정 탭(#gid=…)이 들어 있으면, 이번 주·이번 달 탭을 찾지 못할 때 그 탭을 먼저 엽니다.</p>
    </div>
    <div class="dlg-foot">${P.data && P.data.connected ? '<button type="button" class="btn danger" data-act="planUnlink" style="margin-right:auto">연결 끊기</button>' : ''}<button type="button" class="btn line" data-act="close">닫기</button><button class="btn primary" type="submit">연결</button></div></form>`);
  document.getElementById('planForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const b = e.target.querySelector('[type=submit]'); b.disabled = true; b.textContent = '확인하는 중…';
    try {
      const r = await api('planSet', { url: e.target.url.value.trim() });
      closeDialog(); toast(`‘${r.title}’ 시트를 연결했습니다.`);
      state.plan = { gid: null, data: null, error: null, loading: false }; renderPortal();
    } catch (err) { formMsg(err.message); b.disabled = false; b.textContent = '연결'; }
  });
}

/* ───────── 웹앱 보기 ─────────
   포털 주소?app=ID 로 열면, Apps Script에서 HTML 내용만 받아 격리된 화면(sandbox iframe)에 띄웁니다.
   - 구글 로그인 정보 없이 받아 오므로, 구글 계정이 여러 개 로그인돼 있어도 열립니다.
   - 격리된 화면은 포털과 출처가 달라 포털의 로그인 정보에 접근할 수 없습니다.
   - 웹앱이 쓰는 브라우저 저장소(localStorage)는 대신 흉내 내고, 내용은 웹앱별로 따로 저장해 둡니다. */
function storeShim(init) {
  const data = JSON.stringify(init || {}).replace(/</g, '\\u003c');
  return `<script>(function(){function mk(o,persist){var s=o||{},K=function(){return Object.keys(s)};
function save(){if(persist){try{parent.postMessage({hmStore:s},'*')}catch(e){}}}
var a={getItem:function(k){k=String(k);return Object.prototype.hasOwnProperty.call(s,k)?s[k]:null},
setItem:function(k,v){s[String(k)]=String(v);save()},removeItem:function(k){delete s[String(k)];save()},
clear:function(){s={};save()},key:function(i){return K()[i]===undefined?null:K()[i]}};
Object.defineProperty(a,'length',{get:function(){return K().length}});return a}
try{Object.defineProperty(window,'localStorage',{value:mk(${data},true),configurable:true})}catch(e){}
try{Object.defineProperty(window,'sessionStorage',{value:mk({},false),configurable:true})}catch(e){}})();<\/script>`;
}
function withShim(html, init) {
  const shim = storeShim(init);
  const at = (re) => { const m = re.exec(html); return m ? m.index + m[0].length : -1; };
  let i = at(/<head[^>]*>/i); if (i < 0) i = at(/<html[^>]*>/i); if (i < 0) i = at(/<!doctype[^>]*>/i);
  return i < 0 ? shim + html : html.slice(0, i) + shim + html.slice(i);
}
async function renderAppViewer(id) {
  document.title = '웹앱 · 하늘마루';
  app.innerHTML = `<div class="viewer"><div class="vbar"><span class="mark" aria-hidden="true"></span><b id="vTitle">불러오는 중…</b><span class="vname">하늘마루</span></div><div class="vmsg" id="vBody">웹앱을 불러오는 중…</div></div>`;
  let res;
  try {
    if (DEMO) res = Mock.appContent(id);
    else { const r = await fetch(API_URL + (API_URL.includes('?') ? '&' : '?') + 'app=' + encodeURIComponent(id) + '&raw=1'); res = await r.json(); }
  } catch (e) { res = { ok: false, message: '웹앱을 불러오지 못했습니다. 인터넷 연결을 확인하고 새로고침해 주세요.' }; }
  const body = document.getElementById('vBody');
  if (!res || !res.ok) { document.getElementById('vTitle').textContent = '웹앱을 열 수 없습니다'; body.textContent = (res && res.message) || '찾을 수 없는 웹앱입니다.'; return; }
  const { title, html } = res.data;
  document.title = title; document.getElementById('vTitle').textContent = title;
  const key = 'hmapp:' + id;
  let saved = {}; try { saved = JSON.parse(localStorage.getItem(key) || '{}'); } catch (e) { saved = {}; }
  const frame = document.createElement('iframe');
  // allow-same-origin은 일부러 넣지 않습니다(넣으면 웹앱이 포털 로그인 정보에 접근할 수 있게 됨)
  frame.setAttribute('sandbox', 'allow-scripts allow-forms allow-modals allow-popups allow-popups-to-escape-sandbox allow-downloads allow-top-navigation-by-user-activation');
  frame.setAttribute('allow', 'fullscreen; clipboard-write; autoplay');
  frame.title = title;
  window.addEventListener('message', (e) => {
    if (e.source !== frame.contentWindow || !e.data || typeof e.data.hmStore !== 'object') return;
    try { const str = JSON.stringify(e.data.hmStore); if (str.length < 2000000) localStorage.setItem(key, str); } catch (x) { /* 저장 공간 부족 */ }
  });
  frame.srcdoc = withShim(html, saved);
  body.replaceWith(frame);
}

/* ───────── 시작 ───────── */
(async function start() {
  const appId = new URLSearchParams(location.search).get('app');
  if (appId) { renderAppViewer(appId); return; }
  if (state.token) { try { await load(); } catch (e) { clearSession(); } }
  render();
})();
</script>
