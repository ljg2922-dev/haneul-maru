<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>하늘마루 · 인천하늘초등학교</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --bg:#f3f5f8; --surface:#ffffff; --sunken:#f6f7f9;
  --ink:#172033; --ink-2:#4a5468; --ink-3:#8b93a3; --line:#e5e8ee; --line-2:#d5dae3;
  --brand:#1f5fd1; --brand-ink:#163f8f;
  --s-admin:#3b7cf0; --s-learn:#d8921a; --s-apply:#e5484d; --s-tally:#12a172; --s-link:#8b5cf6; --s-users:#6b7385;
  --font:"Pretendard Variable", Pretendard, "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --r-sm:8px; --r:12px; --r-lg:16px;
  --shadow:0 1px 2px rgba(23,32,51,.04), 0 1px 1px rgba(23,32,51,.03);
  --shadow-lift:0 12px 32px -12px rgba(23,32,51,.18);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
#app{min-height:100vh}
body{font-family:var(--font);color:var(--ink);background:var(--bg);font-size:15px;line-height:1.6;letter-spacing:-.011em;
  -webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.num{font-variant-numeric:tabular-nums}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}

/* ── 버튼·입력 ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:40px;padding:0 16px;border:0;border-radius:var(--r-sm);
  background:var(--ink);color:#fff;font-weight:600;font-size:14.5px;cursor:pointer;text-decoration:none;white-space:nowrap;transition:background .15s,box-shadow .15s}
.btn:hover{background:#26324b}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--brand)}.btn.primary:hover{background:var(--brand-ink)}
.btn.line{background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line-2)}
.btn.line:hover{background:var(--sunken)}
.btn.sm{height:32px;padding:0 12px;font-size:13.5px}
.btn.danger{background:var(--surface);color:#c4343a;box-shadow:inset 0 0 0 1px #f0cfd0}
.btn.danger:hover{background:#fdf3f3}
.btn.ok{background:var(--s-tally)}.btn.ok:hover{background:#0e8a61}
.btn svg.i{width:16px;height:16px}
.txt{background:none;border:0;padding:4px 6px;border-radius:6px;color:var(--ink-3);font-size:13px;font-weight:500;cursor:pointer}
.txt:hover{color:var(--ink);background:var(--sunken)}
label.f{display:block;margin-bottom:16px}
label.f>span,.flabel{display:block;font-size:13px;font-weight:600;color:var(--ink-2);margin-bottom:6px}
label.f small,.flabel small{font-weight:400;color:var(--ink-3);margin-left:4px}
.in{width:100%;height:44px;border:1px solid var(--line-2);border-radius:var(--r-sm);padding:0 13px;background:var(--surface);transition:border-color .15s,box-shadow .15s}
select.in{padding-right:8px}
textarea.in{height:auto;min-height:104px;padding:11px 13px;resize:vertical;line-height:1.6}
.in::placeholder{color:#a8afbc}
.in:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(31,95,209,.14)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.msg{padding:11px 14px;border-radius:var(--r-sm);font-size:14px;margin-bottom:16px}
.msg.err{background:#fdf1f1;color:#b4282e}
.msg.ok{background:#ecf8f3;color:#0b7552}
.hint{font-size:13px;color:var(--ink-3);margin:-6px 0 16px}

/* ── 입구 ── */
.gate{min-height:100vh;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);background:var(--surface)}
.gate-sky{position:relative;overflow:hidden;color:#fff;padding:48px 56px;display:flex;flex-direction:column;justify-content:space-between;
  background:
    radial-gradient(120% 80% at 80% 110%, rgba(255,255,255,.55) 0%, rgba(255,255,255,0) 55%),
    radial-gradient(90% 60% at 10% 0%, #0d2a63 0%, rgba(13,42,99,0) 70%),
    linear-gradient(170deg,#173e8c 0%,#2c66cc 42%,#79aee9 78%,#cfe2f7 100%)}
.gate-sky::before,.gate-sky::after{content:"";position:absolute;border-radius:50%;background:#fff;filter:blur(48px);opacity:.28;pointer-events:none}
.gate-sky::before{width:520px;height:120px;left:-80px;bottom:22%}
.gate-sky::after{width:380px;height:90px;right:-60px;bottom:8%;opacity:.4}
.gate-top{position:relative;display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600;opacity:.92}
.gate-mid{position:relative}
.gate-title{font-weight:800;font-size:clamp(64px,8.4vw,120px);line-height:.95;letter-spacing:-.055em;margin:0 0 22px}
.gate-lead{font-size:17px;line-height:1.65;max-width:25em;margin:0;color:rgba(255,255,255,.86);letter-spacing:-.015em}
.gate-menu{position:relative;display:flex;flex-wrap:wrap;gap:6px 22px;font-size:13.5px;color:rgba(255,255,255,.82)}
.gate-menu span{display:inline-flex;align-items:center;gap:8px}
.gate-menu i{width:6px;height:6px;border-radius:50%;background:var(--c);box-shadow:0 0 0 2px rgba(255,255,255,.5)}
.gate-panel{display:flex;align-items:center;justify-content:center;padding:48px 32px}
.gate-form{width:100%;max-width:360px}
.gate-form h2{font-size:26px;font-weight:750;letter-spacing:-.035em;margin:0 0 6px}
.gate-form p.sub{margin:0 0 28px;color:var(--ink-3);font-size:14.5px}
.gate-switch{margin-top:22px;text-align:center;font-size:14px;color:var(--ink-3)}
.gate-switch button{background:none;border:0;color:var(--brand);font-weight:600;cursor:pointer;padding:2px 4px}
.demo-note{margin-top:28px;padding:12px 14px;border-radius:var(--r-sm);background:var(--sunken);color:var(--ink-2);font-size:13px;line-height:1.6;border:1px dashed var(--line-2)}
.mark{width:28px;height:28px;border-radius:8px;flex:none;
  background:linear-gradient(160deg,#2c66cc 0%,#79aee9 100%);position:relative;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(255,255,255,.25)}
.mark::after{content:"";position:absolute;left:-20%;right:-20%;bottom:-38%;height:70%;border-radius:50%;background:rgba(255,255,255,.92)}
.gate-top .mark{box-shadow:inset 0 0 0 1px rgba(255,255,255,.45)}

/* ── 승인 대기 ── */
.wait{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.wait-card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:44px 40px;max-width:440px;text-align:center;box-shadow:var(--shadow-lift)}
.wait-card .badge{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:#9a6700;background:#fff6dc;padding:5px 12px;border-radius:999px}
.wait-card h2{font-size:22px;font-weight:750;letter-spacing:-.03em;margin:18px 0 8px}
.wait-card p{color:var(--ink-2);margin:0 0 26px}

/* ── 포털 ── */
.portal{min-height:100vh;display:grid;grid-template-columns:256px minmax(0,1fr)}
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;background:var(--surface);border-right:1px solid var(--line);padding:22px 14px 16px}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px 26px}
.brand b{display:block;font-size:16.5px;font-weight:750;letter-spacing:-.035em;line-height:1.2}
.brand small{display:block;font-size:12px;color:var(--ink-3);line-height:1.3}
.nav-cap{font-size:12px;font-weight:600;color:var(--ink-3);padding:0 10px 8px}
.tabs{display:flex;flex-direction:column;gap:2px}
.tab{display:flex;align-items:center;gap:11px;height:40px;padding:0 10px;border:0;border-radius:var(--r-sm);background:transparent;color:var(--ink-2);
  font-weight:500;font-size:14.5px;text-align:left;cursor:pointer;transition:background .12s,color .12s}
.tab .d{width:8px;height:8px;border-radius:3px;background:var(--c);flex:none;opacity:.9}
.tab:hover{background:var(--sunken);color:var(--ink)}
.tab[aria-current="page"]{background:#edf1f7;color:var(--ink);font-weight:650}
.tab .n{margin-left:auto;font-size:12.5px;color:var(--ink-3);font-weight:500;font-variant-numeric:tabular-nums}
.tab .alert{margin-left:auto;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--s-apply);color:#fff;font-size:11.5px;font-weight:700;display:grid;place-items:center}
.nav-gap{height:18px}
.side-fill{flex:1}
.me{display:flex;align-items:center;gap:10px;padding:12px 8px 0;border-top:1px solid var(--line)}
.avatar{width:34px;height:34px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:14px;font-weight:700;color:var(--brand-ink);background:#e3ecfb}
.me-txt{min-width:0;flex:1}
.me-txt b{display:block;font-size:14px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me-txt small{display:block;font-size:12px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.menu-wrap{position:relative}
.icon-btn{width:32px;height:32px;border:0;border-radius:var(--r-sm);background:transparent;color:var(--ink-3);display:grid;place-items:center;cursor:pointer}
.icon-btn:hover{background:var(--sunken);color:var(--ink)}
.pop{position:absolute;bottom:40px;right:0;min-width:168px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow-lift);padding:6px;z-index:20}
.pop button{display:flex;width:100%;align-items:center;gap:8px;border:0;background:none;padding:9px 10px;border-radius:7px;font-size:14px;cursor:pointer;color:var(--ink-2);text-align:left}
.pop button:hover{background:var(--sunken);color:var(--ink)}

.main{min-width:0;padding:40px 48px 64px}
.wrap{max-width:1180px;margin:0 auto}
.head{display:flex;gap:24px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;margin-bottom:26px}
.head h1{display:flex;align-items:center;gap:12px;font-size:30px;font-weight:750;letter-spacing:-.04em;line-height:1.2;margin:0 0 6px}
.head h1 .d{width:10px;height:10px;border-radius:3px;background:var(--accent)}
.head p{margin:0;color:var(--ink-2);font-size:15px;max-width:44em}
.toolbar{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:20px}
.search{position:relative;width:260px}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--ink-3);width:16px;height:16px}
.search input{width:100%;height:38px;border:1px solid var(--line-2);border-radius:var(--r-sm);padding:0 12px 0 36px;background:var(--surface)}
.search input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(31,95,209,.12)}
.filters{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.seg{display:inline-flex;background:#e9edf3;border-radius:9px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{height:30px;border:0;background:transparent;padding:0 12px;border-radius:7px;font-size:13.5px;font-weight:500;color:var(--ink-2);cursor:pointer}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:650;box-shadow:0 1px 2px rgba(23,32,51,.1)}
.filters select{height:36px;border:1px solid var(--line-2);border-radius:var(--r-sm);padding:0 10px;font-size:13.5px;color:var(--ink-2);background:var(--surface)}
.empty{border:1px dashed var(--line-2);border-radius:var(--r-lg);padding:56px 24px;text-align:center;color:var(--ink-3);background:rgba(255,255,255,.5)}
.empty b{display:block;color:var(--ink);font-size:16px;font-weight:650;margin-bottom:4px}
.empty .btn{margin-top:18px}
.meta{font-size:13px;color:var(--ink-3)}
.own{display:flex;gap:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow);transition:border-color .15s,box-shadow .15s}

/* 행정 지원 */
.apps{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.app{position:relative;display:flex;flex-direction:column;padding:20px;min-height:184px}
.app:hover{border-color:var(--line-2);box-shadow:var(--shadow-lift)}
.app .cover{position:absolute;inset:0;border-radius:var(--r-lg);z-index:1}
.app .ico{width:44px;height:44px;border-radius:11px;display:grid;place-items:center;margin-bottom:16px;color:var(--t);background:color-mix(in srgb,var(--t) 11%,#fff);font-size:22px}
.app .ico svg.i{width:22px;height:22px}
.app h3{margin:0 0 4px;font-size:16.5px;font-weight:650;letter-spacing:-.03em;display:flex;align-items:center;gap:6px}
.app h3 svg.i{width:14px;height:14px;color:var(--ink-3);opacity:0;transition:opacity .15s}
.app:hover h3 svg.i{opacity:1}
.app p{margin:0;font-size:14px;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.app .foot{margin-top:auto;padding-top:16px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--ink-2)}
.tag i{width:6px;height:6px;border-radius:50%;background:var(--t)}
.app .own{position:absolute;top:12px;right:12px;z-index:2;opacity:0;transition:opacity .15s}
.app:hover .own,.app:focus-within .own{opacity:1}

/* 신청 */
.tickets{display:grid;gap:12px}
.ticket{display:grid;grid-template-columns:minmax(0,1fr) 200px;overflow:hidden}
.ticket .main-col{padding:22px 24px}
.ticket h3{margin:0 0 6px;font-size:17px;font-weight:650;letter-spacing:-.03em}
.ticket .body{white-space:pre-wrap;color:var(--ink-2);font-size:14.5px;margin:0 0 12px}
.ticket .acts{display:flex;gap:6px;margin-top:14px;align-items:center;flex-wrap:wrap}
.ticket .stub{position:relative;padding:22px 20px;display:flex;flex-direction:column;justify-content:center;gap:10px;border-left:1px dashed var(--line-2);background:var(--sunken)}
.dday{font-size:28px;font-weight:800;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
.dday.urgent{color:var(--s-apply)}
.dday.closed{color:var(--ink-3);font-size:20px;font-weight:700}
.dday small{display:block;font-size:12.5px;font-weight:500;color:var(--ink-3);letter-spacing:-.01em;margin-top:8px;line-height:1.3}
.cap{display:flex;justify-content:space-between;font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.bar{height:4px;border-radius:9px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ink)}
.bar.full i{background:var(--ink-3)}
.applied{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;font-weight:650;color:var(--s-tally)}
.applied svg.i{width:16px;height:16px}

/* 집계 */
.rows{overflow:hidden}
.trow{padding:20px 24px;border-top:1px solid var(--line)}
.trow:first-child{border-top:0}
.trow .top{display:flex;gap:16px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.trow h3{margin:0 0 4px;font-size:16.5px;font-weight:650;letter-spacing:-.03em}
.trow .body{white-space:pre-wrap;color:var(--ink-2);font-size:14.5px;margin:10px 0 0;max-width:62em}
.trow .btns{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.due{display:inline-flex;align-items:center;gap:6px;font-weight:600;color:var(--ink-2)}
.due.soon{color:var(--s-apply)}
.preview{margin-top:16px;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.preview iframe{display:block;width:100%;height:440px;border:0}
.preview p{margin:0;padding:8px 12px;font-size:12.5px;color:var(--ink-3);background:var(--sunken);border-top:1px solid var(--line)}

/* 집계: 양식 설정 */
.cfg{border:1px solid var(--line);border-radius:var(--r);background:var(--sunken);padding:16px;margin-bottom:16px}
.cfg-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.cfg-top b{font-size:14px;font-weight:650}
.cfg-top .meta{display:block}
.frow{display:grid;grid-template-columns:22px minmax(0,1fr) 112px auto;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.frow:first-of-type{border-top:0}
.frow .fname{font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.frow select,.frow .opt{height:34px;border:1px solid var(--line-2);border-radius:7px;background:var(--surface);font-size:13.5px;padding:0 8px;min-width:0}
.frow .opt{grid-column:2 / -1}
.frow.off .fname{color:var(--ink-3);text-decoration:line-through}
.frow.off select,.frow.off .req,.frow.off .opt{opacity:.4;pointer-events:none}
.req{display:inline-flex;align-items:center;gap:4px;font-size:13px;color:var(--ink-2);white-space:nowrap}
.radios{display:flex;flex-direction:column;gap:6px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.radios label{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--ink-2)}
.share{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--ink-2);background:#f3f7fe;border:1px solid #d9e5fa;border-radius:var(--r-sm);padding:10px 12px;margin:-6px 0 16px}
.share code{font-family:inherit;font-weight:650;color:var(--brand-ink);word-break:break-all}
.url-row{display:flex;gap:8px}
.url-row .in{flex:1;min-width:0}
.url-row .btn{height:44px}
.done{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:600;color:var(--s-tally)}
.done svg.i{width:15px;height:15px}
.req-mark{color:var(--s-apply);margin-left:3px}
.warn{font-size:13px;color:#9a6700;background:#fff8e6;border-radius:7px;padding:8px 10px;margin-bottom:10px}

/* 학습자료 */
.mats{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.mat{position:relative;display:flex;flex-direction:column;padding:20px}
.mat:hover{border-color:var(--line-2)}
.mat .kind{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;color:var(--ink-2)}
.mat .kind svg.i{width:15px;height:15px;color:var(--k)}
.mat h3{margin:10px 0 6px;font-size:16.5px;font-weight:650;letter-spacing:-.03em}
.mat p{margin:0 0 16px;font-size:14px;color:var(--ink-2)}
.mat .pills{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.pill{font-size:12px;font-weight:600;color:var(--ink-2);background:var(--sunken);border:1px solid var(--line);padding:2px 9px;border-radius:999px}
.mat .foot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;gap:8px;padding-top:14px;border-top:1px solid var(--line)}
.mat .own{position:absolute;top:14px;right:12px}

/* 바로가기 */
.group{margin-bottom:28px}
.group h2{font-size:13px;color:var(--ink-3);font-weight:600;margin:0 0 10px}
.links{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.lk{position:relative;display:flex;align-items:center;gap:12px;padding:12px 14px;text-decoration:none}
.lk:hover{border-color:var(--line-2);box-shadow:var(--shadow-lift)}
.lk .fav{width:32px;height:32px;border-radius:8px;background:var(--sunken);border:1px solid var(--line);display:grid;place-items:center;flex:none;overflow:hidden}
.lk .fav img{width:18px;height:18px}
.lk b{display:block;font-size:14.5px;font-weight:600;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lk small{display:block;font-size:12px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lk .t{min-width:0;flex:1}
.lk-edit{position:absolute;top:8px;right:8px;z-index:2;opacity:0}
.lk-wrap{position:relative}
.lk-wrap:hover .lk-edit,.lk-wrap:focus-within .lk-edit{opacity:1}

/* 회원 관리 */
.section-title{font-size:15px;font-weight:700;letter-spacing:-.02em;margin:0 0 12px;display:flex;gap:8px;align-items:center}
.section-title .c{font-size:13px;font-weight:600;color:var(--ink-3)}
.pend{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;margin-bottom:36px}
.pcard{padding:18px;display:flex;flex-direction:column;gap:2px}
.pcard b{font-size:16px;font-weight:650}
.pcard .btns{display:flex;gap:6px;margin-top:14px}
.tbl-wrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-size:12.5px;color:var(--ink-3);font-weight:600;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--sunken)}
.tbl td{padding:12px 16px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.st{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600}
.st i{width:7px;height:7px;border-radius:50%}
.st.approved i{background:var(--s-tally)}.st.pending i{background:#e9a514}.st.rejected i{background:var(--s-apply)}

/* 대화상자 */
dialog{border:0;border-radius:18px;padding:0;width:min(560px,calc(100vw - 32px));max-height:calc(100vh - 40px);box-shadow:0 30px 80px -20px rgba(23,32,51,.45);color:var(--ink)}
dialog::backdrop{background:rgba(15,22,36,.42);backdrop-filter:blur(2px)}
.dlg-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:24px 26px 4px}
.dlg-head h2{font-size:20px;font-weight:750;letter-spacing:-.035em;margin:0}
.dlg-head .meta{margin-top:2px}
.dlg-body{padding:18px 26px 6px}
.dlg-foot{display:flex;justify-content:flex-end;gap:8px;padding:10px 26px 24px}
.drop{border:1px dashed var(--line-2);border-radius:var(--r);padding:22px;text-align:center;color:var(--ink-3);font-size:14px;cursor:pointer;background:var(--sunken)}
.drop:hover{border-color:var(--ink-3)}
.drop.has{border-style:solid;border-color:var(--brand);color:var(--ink);background:#f3f7fe}
.icons{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.icons button{height:40px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--surface);color:var(--ink-2);cursor:pointer;display:grid;place-items:center}
.icons button:hover{border-color:var(--line-2);color:var(--ink)}
.icons button[aria-pressed="true"]{border-color:var(--ink);color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.temp-pw{font-size:26px;font-weight:700;letter-spacing:.06em;text-align:center;background:var(--sunken);border:1px solid var(--line);border-radius:var(--r);padding:16px;font-variant-numeric:tabular-nums}

.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:10px;font-size:14px;font-weight:500;z-index:99;box-shadow:var(--shadow-lift)}
@media (prefers-reduced-motion:no-preference){.toast{animation:rise .2s ease-out}}
@keyframes rise{from{opacity:0;transform:translate(-50%,8px)}}
.loading{min-height:100vh;display:grid;place-items:center;color:var(--ink-3)}
.demo-flag{position:fixed;right:16px;bottom:16px;background:var(--surface);color:var(--ink-2);border:1px solid var(--line);font-size:12.5px;font-weight:600;padding:7px 12px;border-radius:999px;z-index:50;box-shadow:var(--shadow-lift);display:flex;align-items:center;gap:6px}
.demo-flag i{width:7px;height:7px;border-radius:50%;background:#e9a514}

/* ── 반응형 ── */
@media (max-width:960px){
  .gate{grid-template-columns:1fr}
  .gate-sky{padding:32px 24px 40px;min-height:340px;gap:40px}
  .gate-title{font-size:64px}
  .gate-panel{padding:36px 20px 56px}
  .portal{grid-template-columns:minmax(0,1fr)}
  .side{min-width:0}
  .side{position:sticky;top:0;z-index:30;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;padding:12px 16px 0;border-right:0;border-bottom:1px solid var(--line)}
  .brand{padding:0;flex:1}
  .brand small{display:none}
  .nav-cap,.nav-gap,.side-fill{display:none}
  .me{order:2;border:0;padding:0}
  .me-txt{display:none}
  .pop{bottom:auto;top:40px}
  .tabs{order:3;width:100%;flex-direction:row;overflow-x:auto;gap:2px;margin-top:10px;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{flex:none;height:42px;border-radius:0;padding:0 12px;border-bottom:2px solid transparent}
  .tab[aria-current="page"]{background:transparent;border-bottom-color:var(--ink)}
  .tab .n{display:none}
  .tab .alert{margin-left:2px}
  .main{padding:26px 16px 56px}
  .head h1{font-size:26px}
  .search{width:100%}
  .head .btn{width:100%}
  .head>div:last-child{width:100%}
  .ticket{grid-template-columns:1fr}
  .ticket .stub{border-left:0;border-top:1px dashed var(--line-2);display:grid;grid-template-columns:auto 1fr;align-items:center;gap:8px 18px}

  .row2{grid-template-columns:1fr}
  .tbl .hide-m{display:none}
  .app .own,.lk-edit{opacity:1}
}

<body>
<div id="app"><div class="loading">불러오는 중…</div></div>

<script>
/* ══════════════════════════════════════════════
   설정: Apps Script 웹 앱 URL을 붙여넣으세요.
   비워 두면 체험용(데모) 모드로 열립니다.

const API_URL = 'https://script.google.com/macros/s/AKfycbzGNBbJeTe7q8djbvcDz0HbLBtjsCKqkiI31wIFTv_6j6Sozq4qHeZ539S7jRuNc17e/exec';

const DEMO = !API_URL;
const app = document.getElementById('app');
const dlg = document.getElementById('dlg');

/* 메뉴 순서는 여기 적힌 순서대로 나옵니다 */
const SECTIONS = {
  admin: { label: '행정 지원', color: 'var(--s-admin)', add: '웹앱 등록',
    desc: '학교에서 만든 업무용 웹앱을 모았습니다. 누르면 새 창에서 열립니다.' },

  apply: { label: '신청', color: 'var(--s-apply)', add: '신청 받기',

  link: { label: '바로가기', color: 'var(--s-link)', add: '바로가기 추가',

  users: { label: '회원 관리', color: 'var(--s-users)', adminOnly: true,
    desc: '가입 신청을 승인하고, 관리자 권한과 비밀번호를 관리합니다.' },
};
const ADMIN_TAGS = { '교무': '#3b7cf0', '학적': '#8b5cf6', '안전': '#e5484d', '보건': '#12a172', '시설': '#d8921a', '기타': '#6b7385' };

const SUBJECTS = ['국어','수학','사회','과학','영어','도덕','음악','미술','체육','실과','창체','기타'];
const KINDS = { webapp: { label: '수업용 웹앱', color: '#3b7cf0', icon: 'app' }, file: { label: '파일 자료', color: '#d8921a', icon: 'file' }, link: { label: '링크 자료', color: '#8b5cf6', icon: 'link' } };

/* 선 아이콘 */
const P = {

  health: 'M12 20s-7.5-4.6-8.8-9.4A4.6 4.6 0 0 1 12 7.2a4.6 4.6 0 0 1 8.8 3.4C19.5 15.4 12 20 12 20zM8 12.5h2l1.2-2 1.8 3.5 1.1-1.5H16',
  wrench: 'M14.7 6.3a4 4 0 0 0-5.3 5.3L3.5 17.5a1.4 1.4 0 0 0 2 2l5.9-5.9a4 4 0 0 0 5.3-5.3l-2.4 2.4-2.1-.5-.5-2.1z',
  calendar: 'M5.5 5h13A1.5 1.5 0 0 1 20 6.5v12a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 18.5v-12A1.5 1.5 0 0 1 5.5 5zM4 10h16M8.5 3v4M15.5 3v4',

  /* UI */

  plus: 'M12 5v14M5 12h14',
  out: 'M14 4h5v5M19 4l-8 8M18 14v4.5a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 4 18.5v-11A1.5 1.5 0 0 1 5.5 6H10',

  clock: 'M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM12 7v5l3 2',
  copy: 'M9 9h10.5v10.5H9zM15 9V5.5A1.5 1.5 0 0 0 13.5 4h-8A1.5 1.5 0 0 0 4 5.5v8A1.5 1.5 0 0 0 5.5 15H9',
  users: 'M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM2.5 20a6.5 6.5 0 0 1 13 0M16 3.5a4 4 0 0 1 0 7.5M18.5 14.5A6.5 6.5 0 0 1 21.5 20',
  eye: 'M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12zM12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z',
};
const APP_ICONS = ['school','door','doc','health','wrench','calendar','chart','megaphone','meal','bus','lock','folder'];
function ic(name, cls = '') { return P[name] ? `<svg class="i ${cls}" viewBox="0 0 24 24" aria-hidden="true"><path d="${P[name]}"/></svg>` : ''; }

const state = {
  token: store('hm_token'), me: null, posts: [], applyCounts: {}, myApplies: [], pendingCount: 0,
  view: store('hm_view') || 'admin', q: '',
  f: { adminTag: '전체', grade: '전체', kind: '전체', subject: '전체' },
  open: {}, users: null, gateTab: 'login',
  tallyCounts: {}, myTallies: {}, serviceEmail: '',
};

/* ───────── 도우미 ───────── */
function store(k, v) {
  try { if (v === undefined) return localStorage.getItem(k); if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) { return null; }
}
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function safeUrl(u) { return /^https?:\/\//i.test(u || '') ? u : '#'; }
function fmtDate(iso) { if (!iso) return ''; const d = new Date(iso); return isNaN(d) ? '' : `${d.getMonth() + 1}월 ${d.getDate()}일`; }
function dday(dateStr) {
  if (!dateStr) return null;
  const t = new Date(); t.setHours(0, 0, 0, 0);
  const d = new Date(dateStr + 'T00:00:00');
  return Math.round((d - t) / 86400000);
}
function toast(msg) {
  document.querySelectorAll('.toast').forEach(t => t.remove());
  const el = document.createElement('div'); el.className = 'toast'; el.setAttribute('role', 'status'); el.textContent = msg;
  document.body.appendChild(el); setTimeout(() => el.remove(), 2600);
}
function host(u) { try { return new URL(u).hostname.replace(/^www\./, ''); } catch (e) { return ''; } }
function canEdit(p) { return state.me && (p.authorId === state.me.id || state.me.role === 'admin'); }
function ownBtns(p) {
  if (!canEdit(p)) return '';
  return `<span class="own"><button class="txt" data-act="edit" data-id="${p.id}">고치기</button><button class="txt" data-act="del" data-id="${p.id}">지우기</button></span>`;
}
function sizeText(n) { if (!n) return ''; return n > 1048576 ? (n / 1048576).toFixed(1) + 'MB' : Math.ceil(n / 1024) + 'KB'; }

/* ───────── 서버 통신 ───────── */
async function api(action, payload = {}) {
  const body = Object.assign({ action, token: state.token }, payload);
  let res;
  try {
    if (DEMO) res = await Mock.call(body);
    else {
      const r = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) });
      res = await r.json();
    }
  } catch (e) {
    throw new Error('서버에 연결하지 못했습니다. 인터넷 연결과 API 주소를 확인해 주세요.');
  }
  if (!res.ok) {
    if (res.code === 'LOGIN' && action !== 'login') { clearSession(); render(); }
    throw new Error(res.message);
  }
  return res.data;
}
function clearSession() { state.token = null; state.me = null; store('hm_token', null); }

async function load() {
  const d = await api('bootstrap');
  Object.assign(state, { me: d.me, posts: d.posts, applyCounts: d.applyCounts, myApplies: d.myApplies, pendingCount: d.pendingCount || 0,
    tallyCounts: d.tallyCounts || {}, myTallies: d.myTallies || {}, serviceEmail: d.serviceEmail || '' });
}

/* ───────── 화면: 입구 ───────── */
function renderGate(message) {
  const login = state.gateTab === 'login';
  const menu = ['admin','learn','apply','tally','link'].map(k => `<span style="--c:${SECTIONS[k].color}"><i></i>${SECTIONS[k].label}</span>`).join('');
  app.innerHTML = `
  <div class="gate">
    <section class="gate-sky">
      <div class="gate-top"><span class="mark" aria-hidden="true"></span>인천하늘초등학교</div>
      <div class="gate-mid">
        <h1 class="gate-title">하늘마루</h1>
        <p class="gate-lead">교직원이 함께 쓰는 업무 공간입니다. 업무 웹앱과 수업 자료, 신청과 집계를 한곳에서 찾습니다.</p>
      </div>
      <div class="gate-menu">${menu}</div>
    </section>
    <section class="gate-panel">
      <form class="gate-form" id="gateForm" novalidate>
        <h2>${login ? '로그인' : '가입 신청'}</h2>
        <p class="sub">${login ? '등록한 이름과 비밀번호를 입력하세요.' : '관리자가 승인하면 그때부터 로그인할 수 있습니다.'}</p>
        ${message ? `<div class="msg ${message.ok ? 'ok' : 'err'}" role="alert">${esc(message.text)}</div>` : ''}
        <label class="f"><span>이름</span><input class="in" name="name" autocomplete="username" required maxlength="20" placeholder="김하늘"></label>
        ${login ? '' : `<label class="f"><span>학년·반 또는 부서<small>선택</small></span><input class="in" name="dept" maxlength="30" placeholder="3학년 2반"></label>`}
        <label class="f"><span>비밀번호${login ? '' : '<small>8자 이상</small>'}</span><input class="in" name="password" type="password" autocomplete="${login ? 'current-password' : 'new-password'}" required minlength="8"></label>
        ${login ? '' : `<label class="f"><span>비밀번호 확인</span><input class="in" name="password2" type="password" autocomplete="new-password" required></label>`}
        <button class="btn primary" style="width:100%;height:46px;margin-top:6px" type="submit">${login ? '로그인' : '가입 신청 보내기'}</button>
        <div class="gate-switch">${login ? '처음 오셨나요?' : '이미 승인받았나요?'}<button type="button" data-act="gateTab" data-tab="${login ? 'register' : 'login'}">${login ? '가입 신청' : '로그인'}</button></div>
        ${DEMO ? `<div class="demo-note">체험용 화면입니다. 이름 <b>관리자</b>, 비밀번호 <b>demo1234</b>로 들어가 볼 수 있습니다. 새로고침하면 입력한 내용은 사라집니다.</div>` : ''}
      </form>
    </section>
  </div>`;
  document.getElementById('gateForm').addEventListener('submit', onGateSubmit);
  app.querySelector('input[name=name]').focus();
}

async function onGateSubmit(e) {
  e.preventDefault();
  const fd = Object.fromEntries(new FormData(e.target));
  const btn = e.target.querySelector('button[type=submit]');
  const login = state.gateTab === 'login';
  if (!fd.name.trim() || !fd.password) return renderGateKeep({ text: '이름과 비밀번호를 모두 입력해 주세요.' }, fd);
  if (!login && fd.password !== fd.password2) return renderGateKeep({ text: '비밀번호 확인이 일치하지 않습니다.' }, fd);
  btn.disabled = true; btn.textContent = login ? '확인하는 중…' : '보내는 중…';
  try {
    if (login) {
      const r = await api('login', { name: fd.name, password: fd.password });
      if (r.status === 'pending') { renderWait(r.name); return; }
      state.token = r.token; store('hm_token', r.token);
      await load(); render();
    } else {
      await api('register', { name: fd.name, dept: fd.dept, password: fd.password });
      state.gateTab = 'login';
      renderGate({ ok: true, text: '가입 신청을 보냈습니다. 관리자가 승인하면 로그인할 수 있습니다.' });
      app.querySelector('input[name=name]').value = fd.name;
    }
  } catch (err) {
    renderGateKeep({ text: err.message }, fd);
  }
}
function renderGateKeep(message, fd) {
  renderGate(message);
  ['name', 'dept'].forEach(k => { const el = app.querySelector(`input[name=${k}]`); if (el && fd[k]) el.value = fd[k]; });
}

function renderWait(name) {
  app.innerHTML = `<div class="wait"><div class="wait-card">
    <span class="badge">${ic('clock')}승인 대기 중</span>
    <h2>${esc(name)} 선생님의 가입 신청이 접수되었습니다</h2>
    <p>관리자가 승인하면 같은 이름과 비밀번호로 로그인할 수 있습니다. 급하면 관리자 선생님께 말씀해 주세요.</p>
    <button class="btn line" data-act="toGate">처음 화면으로</button>
  </div></div>`;
}

/* ───────── 화면: 포털 ───────── */
function countOf(board) { return state.posts.filter(p => p.board === board).length; }

function renderPortal() {
  const isAdmin = state.me.role === 'admin';
  if (!SECTIONS[state.view] || (SECTIONS[state.view].adminOnly && !isAdmin)) state.view = 'admin';
  const v = state.view, S = SECTIONS[v];
  const navItem = ([k, s]) => {
    const n = k === 'users' ? (state.pendingCount ? `<span class="alert" aria-label="승인 대기 ${state.pendingCount}명">${state.pendingCount}</span>` : '') : `<span class="n">${countOf(k)}</span>`;
    return `<button class="tab" style="--c:${s.color}" data-act="nav" data-view="${k}" ${k === v ? 'aria-current="page"' : ''}><span class="d"></span>${s.label}${n}</button>`;
  };
  const entries = Object.entries(SECTIONS);
  const main = entries.filter(([, s]) => !s.adminOnly).map(navItem).join('');
  const adm = isAdmin ? entries.filter(([, s]) => s.adminOnly).map(navItem).join('') : '';
  app.innerHTML = `
  <div class="portal">
    <aside class="side">
      <div class="brand"><span class="mark" aria-hidden="true"></span><div><b>하늘마루</b><small>인천하늘초등학교</small></div></div>
      <nav class="tabs" aria-label="메뉴">${main}${adm ? `<div class="nav-gap"></div><div class="nav-cap">관리</div>${adm}` : ''}</nav>
      <div class="side-fill"></div>
      <div class="me">
        <span class="avatar" aria-hidden="true">${esc(state.me.name.slice(0, 1))}</span>
        <div class="me-txt"><b>${esc(state.me.name)}</b><small>${esc(state.me.dept || '교직원')}${isAdmin ? ' (관리자)' : ''}</small></div>
        <div class="menu-wrap">
          <button class="icon-btn" data-act="menu" aria-haspopup="true" aria-expanded="false" aria-label="내 계정 메뉴">${ic('more')}</button>
        </div>
      </div>
    </aside>
    <main class="main" style="--accent:${S.color}">
      <div class="wrap">
        <header class="head">
          <div><h1><span class="d"></span>${S.label}</h1><p>${S.desc}</p></div>
          ${v === 'users' ? '' : `<div><button class="btn" data-act="new">${ic('plus')}${S.add}</button></div>`}
        </header>
        ${v === 'users' ? '' : `<div class="toolbar">
          <div class="filters" id="filters"></div>
          <label class="search"><span class="sr">${S.label}에서 찾기</span>${ic('search')}<input id="q" type="search" placeholder="제목, 내용, 올린 사람" value="${esc(state.q)}"></label>
        </div>`}
        <div id="list"></div>
      </div>
    </main>
  </div>
  ${DEMO ? '<div class="demo-flag"><i></i>체험용 화면</div>' : ''}`;
  const q = document.getElementById('q');
  if (q) q.addEventListener('input', () => { state.q = q.value; renderList(); });
  renderFilters(); renderList();
}

function segBtn(group, value, cur, label) { return `<button data-act="filter" data-g="${group}" data-v="${esc(value)}" aria-pressed="${value === cur}">${esc(label || value)}</button>`; }

function renderFilters() {
  const el = document.getElementById('filters'); if (!el) return;
  const f = state.f;
  if (state.view === 'admin') el.innerHTML = `<div class="seg">${['전체', ...Object.keys(ADMIN_TAGS)].map(t => segBtn('adminTag', t, f.adminTag)).join('')}</div>`;
  else if (state.view === 'learn') el.innerHTML =
    `<div class="seg">${['전체', ...GRADES].map(g => segBtn('grade', g, f.grade, g.replace('학년', ''))).join('')}</div>` +
    `<select data-act="subject" aria-label="교과"><option value="전체">모든 교과</option>${SUBJECTS.map(s => `<option ${s === f.subject ? 'selected' : ''}>${s}</option>`).join('')}</select>` +
    `<select data-act="kind" aria-label="자료 종류"><option value="전체">모든 종류</option>${Object.entries(KINDS).map(([k, o]) => `<option value="${k}" ${k === f.kind ? 'selected' : ''}>${o.label}</option>`).join('')}</select>`;
  else el.innerHTML = '';
}

function filtered(board) {
  const q = state.q.trim().toLowerCase();
  return state.posts.filter(p => p.board === board).filter(p => !q || (p.title + ' ' + p.body + ' ' + p.authorName).toLowerCase().includes(q));
}

function emptyBox(title, text) {
  const S = SECTIONS[state.view];
  return `<div class="empty"><b>${title}</b>${text}${S.add && !state.q.trim() ? `<br><button class="btn line" data-act="new">${ic('plus')}${S.add}</button>` : ''}</div>`;
}

function renderList() {
  const el = document.getElementById('list');
  const v = state.view;
  if (v === 'users') return renderUsers(el);
  let items = filtered(v);
  const searching = state.q.trim();
  if (v === 'admin') {
    if (state.f.adminTag !== '전체') items = items.filter(p => (p.extra.tag || '기타') === state.f.adminTag);
    el.innerHTML = items.length ? `<div class="apps">${items.map(appTile).join('')}</div>`
      : emptyBox(searching ? '찾는 웹앱이 없습니다' : '등록된 웹앱이 없습니다', searching ? '다른 낱말로 찾아보세요.' : '학교에서 만든 업무용 웹앱 주소를 등록하면 모두가 여기서 엽니다.');
  } else if (v === 'apply') {
    items.sort((a, b) => {
      const da = dday(a.extra.deadline), db = dday(b.extra.deadline);
      const ca = da !== null && da < 0, cb = db !== null && db < 0;
      if (ca !== cb) return ca ? 1 : -1;
      return (da ?? 9999) - (db ?? 9999);
    });
    el.innerHTML = items.length ? `<div class="tickets">${items.map(ticket).join('')}</div>`
      : emptyBox(searching ? '찾는 신청이 없습니다' : '진행 중인 신청이 없습니다', searching ? '다른 낱말로 찾아보세요.' : '연수, 협의실 예약, 동아리 모집처럼 선생님들께 받을 신청을 올려 보세요.');
  } else if (v === 'tally') {
    el.innerHTML = items.length ? `<div class="card rows">${items.map(tallyRow).join('')}</div>`
      : emptyBox(searching ? '찾는 집계가 없습니다' : '진행 중인 집계가 없습니다', searching ? '다른 낱말로 찾아보세요.' : '구글 시트 주소와 안내 글을 올리면 선생님들이 바로 시트를 열어 입력합니다.');
  } else if (v === 'learn') {
    const f = state.f;
    items = items.filter(p => (f.grade === '전체' || p.extra.grade === f.grade) && (f.subject === '전체' || p.extra.subject === f.subject) && (f.kind === '전체' || p.extra.kind === f.kind));
    el.innerHTML = items.length ? `<div class="mats">${items.map(matCard).join('')}</div>`
      : emptyBox('조건에 맞는 자료가 없습니다', '학년·교과 선택을 바꾸거나 새 자료를 올려 보세요.');
  } else if (v === 'link') {
    const groups = {};
    items.forEach(p => { const g = p.extra.group || '기타'; (groups[g] = groups[g] || []).push(p); });
    const names = Object.keys(groups).sort((a, b) => a === '기타' ? 1 : b === '기타' ? -1 : a.localeCompare(b, 'ko'));
    el.innerHTML = names.length ? names.map(g => `<div class="group"><h2>${esc(g)}</h2><div class="links">${groups[g].map(linkTile).join('')}</div></div>`).join('')
      : emptyBox('바로가기가 없습니다', '교육청, 업무 시스템처럼 자주 가는 사이트를 추가해 보세요.');
  }
}

function appIcon(icon) { return P[icon] && APP_ICONS.includes(icon) ? ic(icon) : `<span>${esc(icon || '')}</span>` || ic('school'); }

function appTile(p) {
  const tag = p.extra.tag || '기타';
  return `<div class="card app" style="--t:${ADMIN_TAGS[tag] || ADMIN_TAGS['기타']}">
    <a class="cover" href="${esc(safeUrl(p.url))}" target="_blank" rel="noopener" aria-label="${esc(p.title)} 새 창에서 열기"></a>
    <div class="ico">${p.extra.icon ? appIcon(p.extra.icon) : ic('school')}</div>
    <h3>${esc(p.title)}${ic('out')}</h3>
    <p>${esc(p.body)}</p>
    <div class="foot"><span class="tag"><i></i>${esc(tag)}</span><span class="meta">${esc(p.authorName)}</span></div>
    ${ownBtns(p)}
  </div>`;
}

function ticket(p) {
  const d = dday(p.extra.deadline);
  const closed = d !== null && d < 0;
  const cnt = state.applyCounts[p.id] || 0;
  const cap = Number(p.extra.capacity || 0);
  const full = cap > 0 && cnt >= cap;
  const mine = state.myApplies.includes(p.id);
  const ddayText = d === null ? '상시' : closed ? '마감' : d === 0 ? 'D-day' : `D-${d}`;
  const ddayCls = closed || d === null ? 'closed' : d <= 3 ? 'urgent' : '';
  const sub = d === null ? '마감일 없음' : closed ? `${fmtDate(p.extra.deadline)} 마감됨` : `${fmtDate(p.extra.deadline)}까지`;
  let action;
  if (mine) action = `<span class="applied">${ic('check')}신청함</span>${closed ? '' : `<button class="txt" data-act="cancelApply" data-id="${p.id}">취소</button>`}`;
  else if (closed) action = `<button class="btn sm line" disabled>마감되었습니다</button>`;
  else if (full) action = `<button class="btn sm line" disabled>정원이 찼습니다</button>`;
  else action = `<button class="btn sm" data-act="apply" data-id="${p.id}">신청하기</button>`;
  return `<article class="card ticket">
    <div class="main-col">
      <h3>${esc(p.title)}</h3>
      ${p.body ? `<p class="body">${esc(p.body)}</p>` : ''}
      <div class="meta">${esc(p.authorName)} · ${fmtDate(p.createdAt)}에 올림</div>
      ${(p.url || canEdit(p)) ? `<div class="acts">
        ${p.url ? `<a class="btn sm line" href="${esc(safeUrl(p.url))}" target="_blank" rel="noopener">참고 자료</a>` : ''}
        ${canEdit(p) ? `<button class="btn sm line" data-act="applicants" data-id="${p.id}">${ic('users')}신청자 명단</button>` : ''}
        ${ownBtns(p)}
      </div>` : ''}
    </div>
    <div class="stub">
      <div class="dday ${ddayCls}">${ddayText}<small>${sub}</small></div>
      <div class="cap"><span>${cap ? '신청 인원' : '신청'}</span><span>${cap ? `${cnt} / ${cap}명` : `${cnt}명`}</span></div>
      ${cap ? `<div class="bar ${full ? 'full' : ''}"><i style="width:${Math.min(100, cnt / cap * 100)}%"></i></div>` : ''}
      <div class="act" style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">${action}</div>
    </div>
  </article>`;
}

function sheetPreview(url) { const m = /\/spreadsheets\/d\/([\w-]+)/.exec(url || ''); return m ? `https://docs.google.com/spreadsheets/d/${m[1]}/preview` : null; }
function tallyRow(p) {
  const d = dday(p.extra.due);
  const over = d !== null && d < 0;
  const pv = sheetPreview(p.url);
  const open = state.open[p.id];
  const form = (p.extra.fields || []).length > 0;
  const owner = canEdit(p);
  const due = p.extra.due ? `<span class="due ${d !== null && d >= 0 && d <= 3 ? 'soon' : ''}">${ic('clock')}${fmtDate(p.extra.due)}까지${d !== null && d >= 0 ? ` (D-${d})` : ' (끝남)'}</span>` : '';
  const mine = state.myTallies[p.id];
  const cnt = state.tallyCounts[p.id] || 0;
  let main = '';
  if (form) {
    const label = mine ? (p.extra.mode === 'multi' ? '한 번 더 입력' : '고쳐 입력하기') : '입력하기';
    main = over ? `<button class="btn sm line" disabled>기한이 지났습니다</button>` : `<button class="btn sm" data-act="tallyInput" data-id="${p.id}">${label}</button>`;
  } else if (p.url) main = `<a class="btn sm" href="${esc(safeUrl(p.url))}" target="_blank" rel="noopener">시트에 입력하기</a>`;
  const showSheet = !form || owner;
  return `<article class="trow">
    <div class="top">
      <div>
        <h3>${esc(p.title)}</h3>
        <div class="meta">${due ? due + ' · ' : ''}${form ? `<span class="num">${cnt}건 제출</span> · ` : ''}${esc(p.authorName)} · ${fmtDate(p.createdAt)}</div>
        ${form && mine ? `<div class="done" style="margin-top:6px">${ic('check')}${fmtDate(mine)}에 제출함</div>` : ''}
      </div>
      <div class="btns">
        ${ownBtns(p)}
        ${pv && showSheet ? `<button class="btn sm line" data-act="toggle" data-id="${p.id}" aria-expanded="${!!open}">${ic('eye')}${open ? '닫기' : '미리보기'}</button>` : ''}
        ${form && owner && p.url ? `<a class="btn sm line" href="${esc(safeUrl(p.url))}" target="_blank" rel="noopener">${ic('out')}결과 시트</a>` : ''}
        ${main}
      </div>
    </div>
    ${p.body ? `<p class="body">${esc(p.body)}</p>` : ''}
    ${open && pv && showSheet ? `<div class="preview"><iframe src="${esc(pv)}" title="${esc(p.title)} 미리보기" loading="lazy"></iframe><p>시트 공유 설정에 따라 구글 로그인이 필요할 수 있습니다.</p></div>` : ''}
  </article>`;
}

function matCard(p) {
  const k = KINDS[p.extra.kind] || KINDS.link;
  const openLabel = p.extra.kind === 'webapp' ? '웹앱 열기' : p.extra.kind === 'file' ? '파일 열기' : '열기';
  return `<article class="card mat" style="--k:${k.color}">
    <span class="kind">${ic(k.icon)}${k.label}</span>
    <h3>${esc(p.title)}</h3>
    ${p.body ? `<p>${esc(p.body)}</p>` : ''}
    <div class="pills"><span class="pill">${esc(p.extra.grade || '공통')}</span><span class="pill">${esc(p.extra.subject || '기타')}</span>${p.extra.fileName ? `<span class="pill">${sizeText(p.extra.size)}</span>` : ''}</div>
    <div class="foot">
      <span class="meta">${esc(p.authorName)} · ${fmtDate(p.createdAt)}</span>
      ${p.url ? `<a class="btn sm line" href="${esc(safeUrl(p.url))}" target="_blank" rel="noopener">${openLabel}</a>` : ''}
    </div>
    ${ownBtns(p)}
  </article>`;
}

function linkTile(p) {
  const h = host(p.url);
  return `<div class="lk-wrap">
    <a class="card lk" href="${esc(safeUrl(p.url))}" target="_blank" rel="noopener">
      <span class="fav"><img src="https://www.google.com/s2/favicons?domain=${encodeURIComponent(h)}&sz=64" alt="" loading="lazy" onerror="this.remove()"></span>
      <span class="t"><b>${esc(p.title)}</b><small>${esc(h)}</small></span>
    </a>
    ${canEdit(p) ? `<button class="txt lk-edit" data-act="edit" data-id="${p.id}" aria-label="${esc(p.title)} 고치기">고치기</button>` : ''}
  </div>`;
}

/* ───────── 회원 관리 ───────── */
async function renderUsers(el) {
  if (!state.users) {
    el.innerHTML = '<p class="meta">회원 목록을 불러오는 중…</p>';
    try { state.users = await api('users'); } catch (e) { el.innerHTML = `<div class="msg err">${esc(e.message)}</div>`; return; }
  }
  const pend = state.users.filter(u => u.status === 'pending');
  const statusLabel = { approved: '승인됨', pending: '승인 대기', rejected: '접속 막힘' };
  el.innerHTML = `
    <h2 class="section-title">승인 기다리는 신청<span class="c">${pend.length}건</span></h2>
    ${pend.length ? `<div class="pend">${pend.map(u => `<div class="card pcard">
      <b>${esc(u.name)}</b><span class="meta">${esc(u.dept || '소속 미입력')} · ${fmtDate(u.createdAt)} 신청</span>
      <div class="btns"><button class="btn sm ok" data-act="setUser" data-id="${u.id}" data-status="approved">${ic('check')}승인</button>
      <button class="btn sm danger" data-act="setUser" data-id="${u.id}" data-status="rejected">거절</button></div></div>`).join('')}</div>`
      : `<p class="meta" style="margin:0 0 36px">새 가입 신청이 없습니다.</p>`}
    <h2 class="section-title">전체 회원<span class="c">${state.users.length}명</span></h2>
    <div class="card tbl-wrap"><table class="tbl">
      <thead><tr><th>이름</th><th class="hide-m">소속</th><th>상태</th><th>권한</th><th class="hide-m">마지막 접속</th><th></th></tr></thead>
      <tbody>${state.users.map(u => {
        const self = u.id === state.me.id;
        return `<tr><td><b style="font-weight:600">${esc(u.name)}</b></td><td class="hide-m">${esc(u.dept)}</td>
        <td><span class="st ${u.status}"><i></i>${statusLabel[u.status] || u.status}</span></td>
        <td>${u.role === 'admin' ? '관리자' : '교사'}</td><td class="hide-m meta">${fmtDate(u.lastLogin) || '-'}</td>
        <td style="text-align:right;white-space:nowrap">${self ? '<span class="meta">내 계정</span>' : `
          ${u.status !== 'approved' ? `<button class="txt" data-act="setUser" data-id="${u.id}" data-status="approved">승인</button>` : `<button class="txt" data-act="setUser" data-id="${u.id}" data-status="rejected">접속 막기</button>`}
          <button class="txt" data-act="setUser" data-id="${u.id}" data-role="${u.role === 'admin' ? 'teacher' : 'admin'}">${u.role === 'admin' ? '관리자 해제' : '관리자로 지정'}</button>
          <button class="txt" data-act="resetPw" data-id="${u.id}">비밀번호 초기화</button>`}</td></tr>`;
      }).join('')}</tbody></table></div>`;
}

/* ───────── 대화상자 ───────── */
function openDialog(html) {
  dlg.innerHTML = html; dlg.showModal();
  const first = dlg.querySelector('input:not([type=hidden]):not([type=file]),textarea,select'); if (first) first.focus();
}
function closeDialog() { if (dlg.open) dlg.close(); dlg.innerHTML = ''; }
function dlgHead(title, sub) { return `<div class="dlg-head"><div><h2>${title}</h2>${sub ? `<div class="meta">${sub}</div>` : ''}</div></div>`; }

function postForm(board, p) {
  const e = p ? p.extra : {};
  const v = (x) => esc(x ?? '');
  const today = new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 10);
  let fields = '';
  if (board === 'admin') {
    const curIcon = APP_ICONS.includes(e.icon) ? e.icon : 'school';
    fields = `
    <label class="f"><span>웹앱 이름</span><input class="in" name="title" required maxlength="80" value="${v(p?.title)}" placeholder="방문객 출입기록"></label>
    <label class="f"><span>주소</span><input class="in" name="url" type="url" required value="${v(p?.url)}" placeholder="https://"></label>
    <label class="f"><span>한 줄 설명</span><input class="in" name="body" maxlength="140" value="${v(p?.body)}" placeholder="QR로 방문객 출입을 기록합니다"></label>
    <label class="f" style="max-width:240px"><span>업무 분류</span><select class="in" name="tag">${Object.keys(ADMIN_TAGS).map(t => `<option ${t === (e.tag || '기타') ? 'selected' : ''}>${t}</option>`).join('')}</select></label>
    <div class="f" style="margin-bottom:16px"><span class="flabel">아이콘</span>
      <input type="hidden" name="icon" value="${curIcon}">
      <div class="icons">${APP_ICONS.map(i => `<button type="button" data-act="icon" data-icon="${i}" aria-pressed="${i === curIcon}" aria-label="아이콘 ${i}">${ic(i)}</button>`).join('')}</div></div>`;
  } else if (board === 'apply') fields = `
    <label class="f"><span>제목</span><input class="in" name="title" required maxlength="80" value="${v(p?.title)}" placeholder="11월 교직원 연수 참가 신청"></label>
    <label class="f"><span>안내</span><textarea class="in" name="body" maxlength="4000" placeholder="일시, 장소, 대상 등을 적어 주세요">${v(p?.body)}</textarea></label>
    <div class="row2">
      <label class="f"><span>마감일<small>비우면 상시</small></span><input class="in" name="deadline" type="date" value="${v(e.deadline)}" ${p ? '' : `min="${today}"`}></label>

  else if (board === 'tally') fields = `
    <label class="f"><span>제목</span><input class="in" name="title" required maxlength="80" value="${v(p?.title)}" placeholder="2학기 현장체험학습 희망지 조사"></label>
    <div class="f" style="margin-bottom:16px"><span class="flabel">구글 시트 주소</span>
      <div class="url-row"><input class="in" name="url" type="url" value="${v(p?.url)}" placeholder="https://docs.google.com/spreadsheets/d/…"><button type="button" class="btn line" data-act="inspect">${(e.fields || []).length ? '다시 연결' : '시트 연결'}</button></div></div>
    ${state.serviceEmail ? `<div class="share"><span>사이트에서 입력받으려면 먼저 시트를 아래 주소에 <b>편집자</b>로 공유한 뒤 ‘시트 연결’을 누르세요.</span><code>${esc(state.serviceEmail)}</code><button type="button" class="txt" data-act="copyEmail">주소 복사</button></div>` : ''}
    <div id="tallyCfg"></div>
    <label class="f"><span>안내</span><textarea class="in" name="body" maxlength="4000" placeholder="무엇을 왜 모으는지 적어 주세요">${v(p?.body)}</textarea></label>
    <label class="f" style="max-width:240px"><span>입력 기한<small>선택</small></span><input class="in" name="due" type="date" value="${v(e.due)}"></label>`;
  else if (board === 'learn') {
    const kind = e.kind || 'webapp';
    fields = `
    <label class="f"><span>자료 종류</span><select class="in" name="kind" data-act="kindSel">${Object.entries(KINDS).map(([k, o]) => `<option value="${k}" ${k === kind ? 'selected' : ''}>${o.label}</option>`).join('')}</select></label>
    <label class="f"><span>제목</span><input class="in" name="title" required maxlength="80" value="${v(p?.title)}" placeholder="분수 막대 비교 놀이"></label>
    <div class="row2">
      <label class="f"><span>학년</span><select class="in" name="grade">${GRADES.map(g => `<option ${g === (e.grade || '공통') ? 'selected' : ''}>${g}</option>`).join('')}</select></label>
      <label class="f"><span>교과</span><select class="in" name="subject">${SUBJECTS.map(s => `<option ${s === (e.subject || '기타') ? 'selected' : ''}>${s}</option>`).join('')}</select></label>
    </div>
    <div id="urlBox" ${kind === 'file' ? 'hidden' : ''}><label class="f"><span>주소</span><input class="in" name="url" type="url" value="${kind === 'file' ? '' : v(p?.url)}" placeholder="https://"></label></div>
    <div id="fileBox" ${kind === 'file' ? '' : 'hidden'}>
      <div class="f" style="margin-bottom:16px"><span class="flabel">파일<small>20MB까지, 학교 구글 드라이브에 저장</small></span>
        <div class="drop ${e.fileName ? 'has' : ''}" id="drop" tabindex="0" role="button">${e.fileName ? `${esc(e.fileName)} (${sizeText(e.size)}) · 바꾸려면 누르세요` : '눌러서 파일을 고르거나 여기로 끌어 놓으세요'}</div>
        <input type="file" id="fileIn" hidden></div>
    </div>
    <label class="f"><span>설명</span><textarea class="in" name="body" maxlength="4000" placeholder="수업에서 어떻게 쓰는지 적어 두면 다른 선생님께 도움이 됩니다">${v(p?.body)}</textarea></label>`;
  } else if (board === 'link') {
    const groups = [...new Set(state.posts.filter(x => x.board === 'link').map(x => x.extra.group).filter(Boolean))];
    fields = `
    <label class="f"><span>이름</span><input class="in" name="title" required maxlength="80" value="${v(p?.title)}" placeholder="인천광역시교육청"></label>
    <label class="f"><span>주소</span><input class="in" name="url" type="url" required value="${v(p?.url)}" placeholder="https://"></label>
    <label class="f"><span>분류</span><input class="in" name="group" list="groups" maxlength="20" value="${v(e.group)}" placeholder="교육청, 업무, 수업"><datalist id="groups">${groups.map(g => `<option value="${esc(g)}">`).join('')}</datalist></label>`;
  }
  const S = SECTIONS[board];
  openDialog(`<form id="postForm" novalidate>
    ${dlgHead(p ? `${S.label} 고치기` : S.add)}

    <div class="dlg-foot">
      ${p && board === 'link' ? `<button type="button" class="btn danger" data-act="del" data-id="${p.id}" style="margin-right:auto">지우기</button>` : ''}
      <button type="button" class="btn line" data-act="close">닫기</button>
      <button type="submit" class="btn primary">${p ? '저장' : '올리기'}</button>
    </div></form>`);
  const form = document.getElementById('postForm');
  form._file = null; form._existing = p ? { fileId: e.fileId, fileName: e.fileName, size: e.size, url: p.url } : null;
  form.addEventListener('submit', ev => { ev.preventDefault(); submitPost(form, board, p); });
  if (board === 'tally' && (e.fields || []).length) {
    form._tally = { tab: e.tab, tabs: [e.tab], mode: e.mode || 'once', fields: e.fields.map(f => Object.assign({ on: true }, f)) };
    renderTallyCfg(form);
  }
  const drop = document.getElementById('drop'), fileIn = document.getElementById('fileIn');
  if (drop) {
    const pick = (file) => {
      if (!file) return;
      if (file.size > 20 * 1048576) { formMsg('20MB 이하 파일만 올릴 수 있습니다.'); return; }
      form._file = file; drop.classList.add('has'); drop.textContent = `${file.name} (${sizeText(file.size)})`;
      const t = form.querySelector('[name=title]'); if (!t.value) t.value = file.name.replace(/\.[^.]+$/, '');
    };
    drop.addEventListener('click', () => fileIn.click());
    drop.addEventListener('keydown', ev => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); fileIn.click(); } });
    drop.addEventListener('dragover', ev => { ev.preventDefault(); });
    drop.addEventListener('drop', ev => { ev.preventDefault(); pick(ev.dataTransfer.files[0]); });
    fileIn.addEventListener('change', () => pick(fileIn.files[0]));
  }
}
function formMsg(t) { const el = document.getElementById('formMsg'); if (el) el.innerHTML = `<div class="msg err" role="alert">${esc(t)}</div>`; }

function readBase64(file) {
  return new Promise((ok, no) => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(',')[1]); r.onerror = () => no(new Error('파일을 읽지 못했습니다.')); r.readAsDataURL(file); });
}

async function submitPost(form, board, p) {
  const fd = Object.fromEntries(new FormData(form));
  const btn = form.querySelector('button[type=submit]');
  if (!String(fd.title || '').trim()) return formMsg('제목을 입력해 주세요.');
  const extra = {};
  let url = (fd.url || '').trim();
  if (board === 'admin') { if (!url) return formMsg('웹앱 주소를 입력해 주세요.'); extra.tag = fd.tag; extra.icon = fd.icon; }
  if (board === 'apply') { extra.deadline = fd.deadline || ''; extra.capacity = Math.max(0, parseInt(fd.capacity || '0', 10) || 0); extra.memoLabel = (fd.memoLabel || '').trim(); }
  if (board === 'tally') {
    extra.due = fd.due || '';
    const cfg = readTallyCfg(form);
    if (cfg) {
      if (!url) return formMsg('구글 시트 주소를 입력해 주세요.');
      if (!cfg.fields.length) return formMsg('입력받을 항목을 하나 이상 켜 주세요.');
      const bad = cfg.fields.find(f => f.type === 'select' && !f.options.length);
      if (bad) return formMsg(`‘${bad.name}’ 선택지를 쉼표로 나눠 적어 주세요.`);
      Object.assign(extra, cfg);
    }
  }
  if (board === 'link') { if (!url) return formMsg('주소를 입력해 주세요.'); extra.group = (fd.group || '').trim() || '기타'; }
  if (board === 'learn') {
    Object.assign(extra, { kind: fd.kind, grade: fd.grade, subject: fd.subject });
    if (fd.kind === 'file') {
      if (!form._file && !form._existing?.fileId) return formMsg('올릴 파일을 골라 주세요.');
      if (!form._file) { Object.assign(extra, { fileId: form._existing.fileId, fileName: form._existing.fileName, size: form._existing.size }); url = form._existing.url; }
    } else if (!url) return formMsg('주소를 입력해 주세요.');
  }
  if (url && !/^https?:\/\//i.test(url)) return formMsg('주소는 https:// 로 시작해야 합니다.');
  btn.disabled = true;
  try {
    if (board === 'learn' && fd.kind === 'file' && form._file) {
      btn.textContent = '드라이브에 올리는 중…';
      const up = await api('upload', { name: form._file.name, mimeType: form._file.type, data: await readBase64(form._file) });
      Object.assign(extra, { fileId: up.fileId, fileName: up.name, size: up.size }); url = up.url;
    }
    btn.textContent = '저장하는 중…';
    const saved = await api('savePost', { post: { id: p?.id, board, title: fd.title, body: fd.body || '', url, extra } });
    const i = state.posts.findIndex(x => x.id === saved.id);
    if (i >= 0) state.posts[i] = saved; else state.posts.unshift(saved);
    closeDialog(); renderPortal(); toast(p ? '저장했습니다.' : '올렸습니다.');
  } catch (err) { formMsg(err.message); btn.disabled = false; btn.textContent = p ? '저장' : '올리기'; }
}

/* ───────── 집계 양식 ───────── */
const FTYPES = { text: '짧은 글', long: '긴 글', number: '숫자', date: '날짜', select: '선택지' };
function guessType(name) {
  if (/(수|인원|금액|명수|개수)$/.test(name)) return 'number';
  if (/(날짜|일자|일시)$/.test(name)) return 'date';
  if (/(비고|의견|내용|사유|메모)$/.test(name)) return 'long';
  return 'text';
}
function renderTallyCfg(form) {
  const c = form._tally, box = document.getElementById('tallyCfg');
  if (!c) { box.innerHTML = ''; return; }
  box.innerHTML = `<div class="cfg">
    <div class="cfg-top"><div><b>사이트 입력 양식</b><span class="meta">${c.title ? esc(c.title) + ' · ' : ''}1행 항목으로 만들었습니다. 맨 뒤에 제출자·소속·제출 시각이 자동으로 붙습니다.</span></div>
      ${c.tabs.length > 1 ? `<select class="in" style="width:auto;height:34px" data-act="tabSel" aria-label="탭">${c.tabs.map(t => `<option ${t === c.tab ? 'selected' : ''}>${esc(t)}</option>`).join('')}</select>` : `<span class="pill">${esc(c.tab)} 탭</span>`}</div>
    ${c.writable === false ? '<div class="warn">이 시트는 보기 권한만 있습니다. 편집자로 공유해야 제출 내용이 저장됩니다.</div>' : ''}
    ${c.fields.map((f, i) => `<div class="frow ${f.on ? '' : 'off'}" data-i="${i}">
      <input type="checkbox" data-act="fOn" ${f.on ? 'checked' : ''} aria-label="${esc(f.name)} 입력받기">
      <span class="fname" title="${esc(f.name)}">${esc(f.name)}</span>
      <select data-act="fType" aria-label="${esc(f.name)} 입력 방식">${Object.entries(FTYPES).map(([k, l]) => `<option value="${k}" ${k === f.type ? 'selected' : ''}>${l}</option>`).join('')}</select>
      <label class="req"><input type="checkbox" data-act="fReq" ${f.required ? 'checked' : ''}>필수</label>
      ${f.type === 'select' ? `<input class="opt" data-act="fOpt" value="${esc((f.options || []).join(', '))}" placeholder="선택지를 쉼표로 나눠 적기: 동물원, 과학관, 박물관">` : ''}
    </div>`).join('')}
    <div class="radios">
      <label><input type="radio" name="tmode" value="once" ${c.mode !== 'multi' ? 'checked' : ''}>한 사람당 한 줄 (다시 내면 고쳐 씀)</label>
      <label><input type="radio" name="tmode" value="multi" ${c.mode === 'multi' ? 'checked' : ''}>한 사람이 여러 줄 낼 수 있음</label>
    </div>
    <div style="margin-top:10px"><button type="button" class="txt" data-act="unlink">사이트 입력 끄기 (시트 링크만 걸기)</button></div>
  </div>`;
}
function syncTallyCfg(form) {
  const c = form._tally; if (!c) return;
  document.querySelectorAll('#tallyCfg .frow').forEach(row => {
    const f = c.fields[+row.dataset.i];
    f.on = row.querySelector('[data-act=fOn]').checked;
    f.type = row.querySelector('[data-act=fType]').value;
    f.required = row.querySelector('[data-act=fReq]').checked;
    const o = row.querySelector('[data-act=fOpt]'); if (o) f.options = o.value.split(',').map(x => x.trim()).filter(Boolean);
  });
  const m = document.querySelector('#tallyCfg input[name=tmode]:checked'); if (m) c.mode = m.value;
}
function readTallyCfg(form) {
  if (!form._tally) return null;
  syncTallyCfg(form);
  const c = form._tally;
  return { tab: c.tab, mode: c.mode, fields: c.fields.filter(f => f.on).map(f => ({ name: f.name, type: f.type, required: !!f.required, options: f.type === 'select' ? (f.options || []) : [] })) };
}
async function inspectSheet(form, tab) {
  const url = form.querySelector('[name=url]').value.trim();
  if (!/docs\.google\.com\/spreadsheets\/d\//.test(url)) return formMsg('구글 시트 주소를 붙여넣어 주세요. (docs.google.com/spreadsheets/d/… 형태)');
  const btn = form.querySelector('[data-act=inspect]'); btn.disabled = true; btn.textContent = '확인하는 중…';
  try {
    const r = await api('tallyInspect', { url, tab });
    const prev = {}; if (form._tally) { syncTallyCfg(form); form._tally.fields.forEach(f => { prev[f.name] = f; }); }
    form._tally = { title: r.title, tab: r.tab, tabs: r.tabs, writable: r.writable, mode: form._tally?.mode || 'once',
      fields: r.headers.map(h => prev[h] ? Object.assign({}, prev[h]) : { name: h, type: guessType(h), required: false, on: true, options: [] }) };
    document.getElementById('formMsg').innerHTML = '';
    renderTallyCfg(form);
  } catch (err) { formMsg(err.message); }
  btn.disabled = false; btn.textContent = form._tally ? '다시 연결' : '시트 연결';
}

function fieldInput(f, val) {
  const n = `f_${esc(f.name)}`, req = f.required ? 'required' : '', v = esc(val ?? '');
  let input;
  if (f.type === 'long') input = `<textarea class="in" name="${n}" ${req} maxlength="2000">${v}</textarea>`;
  else if (f.type === 'number') input = `<input class="in" name="${n}" ${req} inputmode="decimal" value="${v}">`;
  else if (f.type === 'date') input = `<input class="in" name="${n}" ${req} type="date" value="${v}">`;
  else if (f.type === 'select') input = `<select class="in" name="${n}" ${req}><option value="">고르세요</option>${f.options.map(o => `<option ${o === val ? 'selected' : ''}>${esc(o)}</option>`).join('')}</select>`;
  else input = `<input class="in" name="${n}" ${req} maxlength="300" value="${v}">`;
  return `<label class="f"><span>${esc(f.name)}${f.required ? '<span class="req-mark" aria-label="필수">*</span>' : ''}</span>${input}</label>`;
}
async function openTallyInput(post) {
  const fields = post.extra.fields;
  const once = post.extra.mode !== 'multi';
  let prev = null;
  if (once && state.myTallies[post.id]) {
    openDialog(`${dlgHead(esc(post.title), '이전에 낸 내용을 불러오는 중…')}<div class="dlg-body" style="padding-bottom:28px"></div>`);
    try { prev = await api('tallyMine', { postId: post.id }); } catch (e) { prev = null; }
  }
  const sub = once ? (prev ? '이전에 낸 내용을 고쳐서 다시 낼 수 있습니다.' : '제출하면 연결된 구글 시트에 바로 저장됩니다.') : '낼 때마다 시트에 한 줄씩 추가됩니다.';
  openDialog(`<form id="tallyForm" novalidate>${dlgHead(esc(post.title), sub)}
    <div class="dlg-body"><div id="formMsg"></div>${post.body ? `<p class="hint" style="margin:0 0 16px;white-space:pre-wrap">${esc(post.body)}</p>` : ''}
    ${fields.map(f => fieldInput(f, prev ? prev[f.name] : '')).join('')}
    <p class="meta" style="margin:0">이름(${esc(state.me.name)})과 소속, 제출 시각은 자동으로 함께 저장됩니다.</p></div>
    <div class="dlg-foot"><button type="button" class="btn line" data-act="close">닫기</button><button class="btn primary" type="submit">${prev ? '고쳐서 제출' : '제출'}</button></div></form>`);
  document.getElementById('tallyForm').addEventListener('submit', async e => {
    e.preventDefault();
    const fd = new FormData(e.target), values = {};
    for (const f of fields) {
      const v = String(fd.get(`f_${f.name}`) ?? '').trim();
      if (f.required && !v) return formMsg(`‘${f.name}’ 항목을 입력해 주세요.`);
      if (v && f.type === 'number' && isNaN(Number(v.replace(/,/g, '')))) return formMsg(`‘${f.name}’ 항목에는 숫자만 입력해 주세요.`);
      values[f.name] = v;
    }
    const b = e.target.querySelector('[type=submit]'); b.disabled = true; b.textContent = '시트에 저장하는 중…';
    try {
      const r = await api('tallySubmit', { postId: post.id, values });
      state.tallyCounts[post.id] = r.count; state.myTallies[post.id] = r.at;
      closeDialog(); renderList(); toast(r.updated ? '고쳐서 제출했습니다.' : '제출했습니다. 시트에 저장되었습니다.');
    } catch (err) { formMsg(err.message); b.disabled = false; b.textContent = prev ? '고쳐서 제출' : '제출'; }
  });
}

async function doApply(id, memo) {
  const r = await api('apply', { postId: id, memo });
  state.applyCounts[id] = r.count; state.myApplies.push(id);
  renderList(); toast('신청했습니다.');
}

function closeMenu() { document.querySelectorAll('.pop').forEach(p => p.remove()); document.querySelectorAll('[data-act=menu]').forEach(b => b.setAttribute('aria-expanded', 'false')); }

/* ───────── 클릭 처리 ───────── */
document.addEventListener('click', async (ev) => {
  const t = ev.target.closest('[data-act]');
  if (!ev.target.closest('.menu-wrap')) closeMenu();
  if (!t) return;
  const act = t.dataset.act, id = t.dataset.id;
  const post = id ? state.posts.find(p => p.id === id) : null;
  try {
    switch (act) {
      case 'gateTab': state.gateTab = t.dataset.tab; renderGate(); break;
      case 'toGate': state.gateTab = 'login'; renderGate(); break;
      case 'menu': {
        if (t.parentElement.querySelector('.pop')) { closeMenu(); break; }
        t.setAttribute('aria-expanded', 'true');
        t.insertAdjacentHTML('afterend', `<div class="pop" role="menu"><button role="menuitem" data-act="pw">${ic('key')}비밀번호 바꾸기</button><button role="menuitem" data-act="logout">${ic('exit')}로그아웃</button></div>`);
        break;
      }
      case 'nav': state.view = t.dataset.view; store('hm_view', state.view); state.q = ''; if (state.view === 'users') state.users = null; renderPortal(); window.scrollTo(0, 0); break;
      case 'filter': state.f[t.dataset.g] = t.dataset.v; renderFilters(); renderList(); break;
      case 'new': postForm(state.view, null); break;
      case 'edit': if (post) postForm(post.board, post); break;
      case 'close': closeDialog(); break;
      case 'icon': {
        dlg.querySelectorAll('[data-act=icon]').forEach(b => b.setAttribute('aria-pressed', b === t));
        dlg.querySelector('input[name=icon]').value = t.dataset.icon; break;
      }
      case 'toggle': state.open[id] = !state.open[id]; renderList(); break;
      case 'inspect': await inspectSheet(document.getElementById('postForm')); break;
      case 'unlink': { const f = document.getElementById('postForm'); f._tally = null; renderTallyCfg(f); f.querySelector('[data-act=inspect]').textContent = '시트 연결'; break; }
      case 'copyEmail': await navigator.clipboard.writeText(state.serviceEmail); toast('주소를 복사했습니다.'); break;

    async call(req) {

      const fn = A[req.action]; if (!fn) return fail('BAD_REQUEST', '알 수 없는 요청입니다.');
      let me = null;
      if (!['register', 'login', 'logout'].includes(req.action)) {
        me = users.find(u => u.id === sessions[req.token]);
        if (!me || me.status !== 'approved') return fail('LOGIN', '로그인이 필요합니다.');
      }
      const out = fn(req, me);
      return out && out.ok === false ? out : { ok: true, data: out };
    },
  };
})();

/* ───────── 시작 ───────── */
(async function start() {
  if (state.token) { try { await load(); } catch (e) { clearSession(); } }
  render();
})();
</script>
