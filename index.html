<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>하늘마루 · 인천하늘초등학교</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --bg:#f3f5f8; --surface:#ffffff; --sunken:#f6f7f9;
  --ink:#172033; --ink-2:#4a5468; --ink-3:#8b93a3; --line:#e5e8ee; --line-2:#d5dae3;
  --brand:#1f5fd1; --brand-ink:#163f8f;
  --s-admin:#3b7cf0; --s-learn:#d8921a; --s-apply:#e5484d; --s-tally:#12a172; --s-link:#8b5cf6; --s-users:#6b7385; --s-plan:#0e9fb5; --s-room:#db2777;
  --font:"Pretendard Variable", Pretendard, "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --r-sm:8px; --r:12px; --r-lg:16px;
  --shadow:0 1px 2px rgba(23,32,51,.04), 0 1px 1px rgba(23,32,51,.03);
  --shadow-lift:0 12px 32px -12px rgba(23,32,51,.18);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
#app{min-height:100vh}
body{font-family:var(--font);color:var(--ink);background:var(--bg);font-size:15px;line-height:1.6;letter-spacing:-.011em;
  -webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.num{font-variant-numeric:tabular-nums}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}

/* ── 버튼·입력 ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:40px;padding:0 16px;border:0;border-radius:var(--r-sm);
  background:var(--ink);color:#fff;font-weight:600;font-size:14.5px;cursor:pointer;text-decoration:none;white-space:nowrap;transition:background .15s,box-shadow .15s}
.btn:hover{background:#26324b}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--brand)}.btn.primary:hover{background:var(--brand-ink)}
.btn.line{background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line-2)}
.btn.line:hover{background:var(--sunken)}
.btn.sm{height:32px;padding:0 12px;font-size:13.5px}
.btn.danger{background:var(--surface);color:#c4343a;box-shadow:inset 0 0 0 1px #f0cfd0}
.btn.danger:hover{background:#fdf3f3}
.btn.ok{background:var(--s-tally)}.btn.ok:hover{background:#0e8a61}
.btn svg.i{width:16px;height:16px}
.txt{background:none;border:0;padding:4px 6px;border-radius:6px;color:var(--ink-3);font-size:13px;font-weight:500;cursor:pointer}
.txt:hover{color:var(--ink);background:var(--sunken)}
label.f{display:block;margin-bottom:16px}
label.f>span,.flabel{display:block;font-size:13px;font-weight:600;color:var(--ink-2);margin-bottom:6px}
label.f small,.flabel small{font-weight:400;color:var(--ink-3);margin-left:4px}
.in{width:100%;height:44px;border:1px solid var(--line-2);border-radius:var(--r-sm);padding:0 13px;background:var(--surface);transition:border-color .15s,box-shadow .15s}
select.in{padding-right:8px}
textarea.in{height:auto;min-height:104px;padding:11px 13px;resize:vertical;line-height:1.6}
.in::placeholder{color:#a8afbc}
.in:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(31,95,209,.14)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.msg{padding:11px 14px;border-radius:var(--r-sm);font-size:14px;margin-bottom:16px}
.msg.err{background:#fdf1f1;color:#b4282e}
.msg.ok{background:#ecf8f3;color:#0b7552}
.hint{font-size:13px;color:var(--ink-3);margin:-6px 0 16px}

/* ── 입구 ── */
.gate{min-height:100vh;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);background:var(--surface)}
.gate-sky{position:relative;overflow:hidden;color:#fff;padding:48px 56px;display:flex;flex-direction:column;justify-content:space-between;
  background:
    radial-gradient(120% 80% at 80% 110%, rgba(255,255,255,.55) 0%, rgba(255,255,255,0) 55%),
    radial-gradient(90% 60% at 10% 0%, #0d2a63 0%, rgba(13,42,99,0) 70%),
    linear-gradient(170deg,#173e8c 0%,#2c66cc 42%,#79aee9 78%,#cfe2f7 100%)}
.gate-sky::before,.gate-sky::after{content:"";position:absolute;border-radius:50%;background:#fff;filter:blur(48px);opacity:.28;pointer-events:none}
.gate-sky::before{width:520px;height:120px;left:-80px;bottom:22%}
.gate-sky::after{width:380px;height:90px;right:-60px;bottom:8%;opacity:.4}
.gate-top{position:relative;display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600;opacity:.92}
.gate-mid{position:relative}
.gate-title{font-weight:800;font-size:clamp(64px,8.4vw,120px);line-height:.95;letter-spacing:-.055em;margin:0 0 22px}
.gate-lead{font-size:17px;line-height:1.65;max-width:25em;margin:0;color:rgba(255,255,255,.86);letter-spacing:-.015em}
.gate-menu{position:relative;display:flex;flex-wrap:wrap;gap:6px 22px;font-size:13.5px;color:rgba(255,255,255,.82)}
.gate-menu span{display:inline-flex;align-items:center;gap:8px}
.gate-menu i{width:6px;height:6px;border-radius:50%;background:var(--c);box-shadow:0 0 0 2px rgba(255,255,255,.5)}
.gate-panel{display:flex;align-items:center;justify-content:center;padding:48px 32px}
.gate-form{width:100%;max-width:360px}
.gate-form h2{font-size:26px;font-weight:750;letter-spacing:-.035em;margin:0 0 6px}
.gate-form p.sub{margin:0 0 28px;color:var(--ink-3);font-size:14.5px}
.gate-switch{margin-top:22px;text-align:center;font-size:14px;color:var(--ink-3)}
.gate-switch button{background:none;border:0;color:var(--brand);font-weight:600;cursor:pointer;padding:2px 4px}
.demo-note{margin-top:28px;padding:12px 14px;border-radius:var(--r-sm);background:var(--sunken);color:var(--ink-2);font-size:13px;line-height:1.6;border:1px dashed var(--line-2)}
.mark{width:28px;height:28px;border-radius:8px;flex:none;
  background:linear-gradient(160deg,#2c66cc 0%,#79aee9 100%);position:relative;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(255,255,255,.25)}
.mark::after{content:"";position:absolute;left:-20%;right:-20%;bottom:-38%;height:70%;border-radius:50%;background:rgba(255,255,255,.92)}
.gate-top .mark{box-shadow:inset 0 0 0 1px rgba(255,255,255,.45)}

/* 비밀번호 칸: 보기 버튼, 한글·Caps Lock 경고 */
.pw{position:relative}
.pw .in{padding-right:64px}
.pw-eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);height:32px;padding:0 10px;border:0;border-radius:6px;background:transparent;color:var(--ink-3);font-size:13px;font-weight:600;cursor:pointer}
.pw-eye:hover{background:var(--sunken);color:var(--ink)}
.pw-hint{display:block;margin-top:6px;font-size:12.5px;font-weight:600;color:#b4540a}
.pw-hint[hidden]{display:none}

/* ── 실 예약 ── */
.rooms{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-bottom:20px}
.rcard{position:relative;display:flex;gap:12px;align-items:flex-start;text-align:left;padding:16px;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);cursor:pointer;box-shadow:var(--shadow);transition:border-color .15s,box-shadow .15s,transform .15s}
.rcard:hover{border-color:var(--line-2);box-shadow:var(--shadow-lift)}
.rcard[aria-pressed="true"]{border-color:var(--rc);box-shadow:0 0 0 2px var(--rc),var(--shadow-lift)}
.rcard .ri{width:40px;height:40px;border-radius:11px;flex:none;display:grid;place-items:center;background:color-mix(in srgb,var(--rc) 13%,#fff);color:var(--rc)}
.rcard .ri svg.i{width:20px;height:20px}
.rcard b{display:block;font-size:15.5px;font-weight:700;letter-spacing:-.03em}
.rcard small{display:block;font-size:12.5px;color:var(--ink-3);margin-top:2px}
.rcard .rtoday{display:block;font-size:12.5px;font-weight:600;color:var(--rc);margin-top:6px}
.rv{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
.cal{padding:18px 18px 14px}
.cal-head{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.cal-head h2{font-size:19px;font-weight:750;letter-spacing:-.035em;margin:0 6px;min-width:120px;text-align:center}
.cal-head .room-name{margin-left:auto;display:inline-flex;align-items:center;gap:7px;font-size:13.5px;font-weight:650;color:var(--ink-2)}
.cal-head .room-name i{width:9px;height:9px;border-radius:3px;background:var(--rc)}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line)}
.cal-grid .wd{font-size:12px;font-weight:650;color:var(--ink-3);text-align:center;padding:7px 0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--sunken)}
.cal-grid .wd.sun,.day.sun .dn{color:#d14343}.cal-grid .wd.sat,.day.sat .dn{color:#2f6fd6}
.day{position:relative;min-height:104px;padding:6px 6px 8px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--surface);cursor:pointer;text-align:left;font:inherit;display:flex;flex-direction:column;gap:3px;min-width:0}
.day:hover{background:#f8fafc}
.day .dn{font-size:13px;font-weight:650;line-height:1.2;display:flex;align-items:center;gap:6px}
.day.out{background:#fafbfc}.day.out .dn{opacity:.35}
.day.past .dn{opacity:.5}.day.past{background:#fcfcfd}
.day.today .dn span{background:var(--ink);color:#fff;border-radius:999px;padding:1px 7px}
.day.sel{box-shadow:inset 0 0 0 2px var(--rc);z-index:1}
.day .free{font-size:11px;font-weight:600;color:var(--s-tally);margin-left:auto}
.bk{display:block;font-size:11.5px;line-height:1.35;padding:2px 6px;border-radius:5px;background:color-mix(in srgb,var(--rc) 11%,#fff);border-left:3px solid var(--rc);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
.bk.mine{background:color-mix(in srgb,var(--rc) 24%,#fff);font-weight:650}
.bk.more{background:none;border:0;color:var(--ink-3);padding:0 6px}
.cal-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-3);margin-top:10px}
.cal-legend span{display:inline-flex;align-items:center;gap:5px}
.cal-legend i{width:12px;height:9px;border-radius:2px;background:color-mix(in srgb,var(--rc) 11%,#fff);border-left:3px solid var(--rc)}
.cal-legend i.m{background:color-mix(in srgb,var(--rc) 24%,#fff)}
.dp{position:sticky;top:20px;padding:18px}
.dp h3{font-size:18px;font-weight:750;letter-spacing:-.035em;margin:0}
.dp .meta{margin:2px 0 14px}
.slots{display:grid;gap:6px}
.slot{display:grid;grid-template-columns:76px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-size:13.5px}
.slot .sl b{display:block;font-size:13.5px;font-weight:700}
.slot .sl small{display:block;font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.slot.booked{background:color-mix(in srgb,var(--rc) 7%,#fff);border-color:color-mix(in srgb,var(--rc) 25%,#fff)}
.slot.booked.mine{border-color:var(--rc)}
.slot .who b{font-weight:650}
.slot .who span{color:var(--ink-3);font-size:12.5px;margin-left:4px}
.slot .who p{margin:2px 0 0;font-size:12.5px;color:var(--ink-2);white-space:normal;overflow-wrap:anywhere}
.slot.free{cursor:pointer}
.slot.free:hover{border-color:var(--ink-3)}
.slot.free .tag2{font-size:12.5px;font-weight:600;color:var(--s-tally)}
.slot.free input{width:18px;height:18px;accent-color:var(--rc);margin:0}
.slot.free:has(input:checked){border-color:var(--rc);box-shadow:inset 0 0 0 1px var(--rc);background:color-mix(in srgb,var(--rc) 6%,#fff)}
.slot.na{color:var(--ink-3);background:var(--sunken)}
.bookform{margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.bookform .btn{width:100%;margin-top:8px;height:44px}
.dp-empty{color:var(--ink-3);font-size:14px;padding:24px 6px;text-align:center}
.rcfg{display:grid;gap:12px}
.rrow{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:14px;align-items:center;padding:16px 18px}
.rrow .ri{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--rc) 13%,#fff);color:var(--rc)}
.rrow b{font-size:16px;font-weight:700}
.rrow .meta span+span::before{content:" · "}
.rrow .off{display:inline-block;font-size:12px;font-weight:650;color:#9a6700;background:#fff6dc;border-radius:999px;padding:1px 8px;margin-left:6px}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatches label{width:30px;height:30px;border-radius:50%;background:var(--sw);cursor:pointer;display:grid;place-items:center;box-shadow:inset 0 0 0 2px rgba(255,255,255,.6)}
.swatches input{position:absolute;opacity:0;pointer-events:none}
.swatches label:has(input:checked){box-shadow:0 0 0 2px #fff,0 0 0 4px var(--sw)}
.swatches label:has(input:focus-visible){outline:2px solid var(--brand);outline-offset:4px}
.slotrows{display:grid;gap:6px;margin-bottom:8px}
.slotrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr) auto;gap:6px}
.slotrow .in{height:38px;font-size:14px}
@media (max-width:1100px){.rv{grid-template-columns:1fr}.dp{position:static}}
@media (max-width:960px){
  .day{min-height:64px;padding:4px}
  .day .bk{font-size:0;height:6px;padding:0;border-left-width:0;border-radius:3px;background:var(--rc);opacity:.55}
  .day .bk.mine{opacity:1}
  .day .bk.more{display:none}
  .day .free{display:none}
  .cal{padding:12px 10px}
  .cal-head .room-name{width:100%;margin:4px 0 0}
}

/* ── 업무계획 ── */
.plan-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.plan-tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;max-width:100%;scrollbar-width:thin}
.plan-tabs button{flex:none;height:34px;padding:0 13px;border:1px solid var(--line-2);border-radius:999px;background:var(--surface);font-size:13.5px;color:var(--ink-2);cursor:pointer;white-space:nowrap}
.plan-tabs button:hover{color:var(--ink);border-color:var(--ink-3)}
.plan-tabs button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:650}
.plan-acts{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.plan-meta{font-size:12.5px;color:var(--ink-3);margin:-4px 0 10px}
.plan-wrap{overflow:auto;max-height:calc(100vh - 250px);min-height:240px;background:#fff;border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow)}
table.plan{border-collapse:collapse;table-layout:fixed;font-size:13.3px;line-height:1.45;color:#111}
.plan td{border:1px solid #e2e5ea;padding:4px 6px;vertical-align:middle;white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere}
.plan thead{position:sticky;top:0;z-index:2;box-shadow:0 1px 0 #cfd4dc}
.plan thead td{background:#f4f6f9}
.plan td.today{outline:2px solid var(--s-apply);outline-offset:-2px}
.plan a{color:var(--brand)}
.plan-empty{padding:40px 24px;text-align:center;color:var(--ink-3)}
@media (max-width:960px){.plan-wrap{max-height:none}}

/* ── 웹앱 보기(?app=) ── */
.viewer{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--surface)}
.vbar{flex:none;height:40px;display:flex;align-items:center;gap:10px;padding:0 12px;border-bottom:1px solid var(--line);font-size:13.5px}
.vbar .mark{width:20px;height:20px;border-radius:6px}
.vbar b{font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.vbar .vname{color:var(--ink-3);white-space:nowrap}
.viewer iframe{flex:1;width:100%;border:0;background:#fff}
.viewer .vmsg{flex:1;display:grid;place-items:center;color:var(--ink-3);padding:24px;text-align:center}

/* ── 승인 대기 ── */
.wait{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.wait-card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:44px 40px;max-width:440px;text-align:center;box-shadow:var(--shadow-lift)}
.wait-card .badge{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:#9a6700;background:#fff6dc;padding:5px 12px;border-radius:999px}
.wait-card h2{font-size:22px;font-weight:750;letter-spacing:-.03em;margin:18px 0 8px}
.wait-card p{color:var(--ink-2);margin:0 0 26px}

/* ── 포털 ── */
.portal{min-height:100vh;display:grid;grid-template-columns:256px minmax(0,1fr)}
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;background:var(--surface);border-right:1px solid var(--line);padding:22px 14px 16px}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px 26px}
.brand b{display:block;font-size:16.5px;font-weight:750;letter-spacing:-.035em;line-height:1.2}
.brand small{display:block;font-size:12px;color:var(--ink-3);line-height:1.3}
.nav-cap{font-size:12px;font-weight:600;color:var(--ink-3);padding:0 10px 8px}
.tabs{display:flex;flex-direction:column;gap:2px}
.tab{display:flex;align-items:center;gap:11px;height:40px;padding:0 10px;border:0;border-radius:var(--r-sm);background:transparent;color:var(--ink-2);
  font-weight:500;font-size:14.5px;text-align:left;cursor:pointer;transition:background .12s,color .12s}
.tab .d{width:8px;height:8px;border-radius:3px;background:var(--c);flex:none;opacity:.9}
.tab:hover{background:var(--sunken);color:var(--ink)}
.tab[aria-current="page"]{background:#edf1f7;color:var(--ink);font-weight:650}
.tab .n{margin-left:auto;font-size:12.5px;color:var(--ink-3);font-weight:500;font-variant-numeric:tabular-nums}
.tab .alert{margin-left:auto;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--s-apply);color:#fff;font-size:11.5px;font-weight:700;display:grid;place-items:center}
.nav-gap{height:18px}
.side-fill{flex:1}
.me{display:flex;align-items:center;gap:10px;padding:12px 8px 0;border-top:1px solid var(--line)}
.avatar{width:34px;height:34px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:14px;font-weight:700;color:var(--brand-ink);background:#e3ecfb}
.me-txt{min-width:0;flex:1}
.me-txt b{display:block;font-size:14px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me-txt small{display:block;font-size:12px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.menu-wrap{position:relative}
.icon-btn{width:32px;height:32px;border:0;border-radius:var(--r-sm);background:transparent;color:var(--ink-3);display:grid;place-items:center;cursor:pointer}
.icon-btn:hover{background:var(--sunken);color:var(--ink)}
.pop{position:absolute;bottom:40px;right:0;min-width:168px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow-lift);padding:6px;z-index:20}
.pop button{display:flex;width:100%;align-items:center;gap:8px;border:0;background:none;padding:9px 10px;border-radius:7px;font-size:14px;cursor:pointer;color:var(--ink-2);text-align:left}
.pop button:hover{background:var(--sunken);color:var(--ink)}

.main{min-width:0;padding:40px 48px 64px}
.wrap{max-width:1180px;margin:0 auto}
.head{display:flex;gap:24px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;margin-bottom:26px}
.head h1{display:flex;align-items:center;gap:12px;font-size:30px;font-weight:750;letter-spacing:-.04em;line-height:1.2;margin:0 0 6px}
.head h1 .d{width:10px;height:10px;border-radius:3px;background:var(--accent)}
.head p{margin:0;color:var(--ink-2);font-size:15px;max-width:44em}
.toolbar{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:20px}
.search{position:relative;width:260px}

/* 신청 현황 */
dialog.wide{width:min(980px,calc(100vw - 32px))}

/* 집계 */
.rows{overflow:hidden}

/* 집계: 입력 화면·결과 화면 */
.done{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:600;color:var(--s-tally)}

.tv-back{display:inline-flex;align-items:center;gap:4px;margin:-8px 0 14px -6px}

.tv-head .btns{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tv-body{white-space:pre-wrap;color:var(--ink-2);font-size:15px;margin:0 0 20px;max-width:62em;line-height:1.7}
.tv-note{font-size:13.5px;color:#9a6700;background:#fff8e6;border-radius:var(--r-sm);padding:11px 14px;margin-bottom:16px}

.entry{padding:22px 24px}
.entry-top{display:flex;justify-content:space-between;align-items:center;margin:-4px 0 14px}
.entry-top b{font-size:14px;font-weight:700;color:var(--ink-2)}
.efields{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:4px 18px}
.efields .wide{grid-column:1 / -1}
.efields label.f,.efields fieldset.f{margin-bottom:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips label{display:inline-flex;align-items:center;gap:7px;height:40px;padding:0 14px;border:1px solid var(--line-2);border-radius:999px;font-size:14px;cursor:pointer;background:var(--surface);user-select:none}
.chips label:has(input:checked){border-color:var(--brand);background:#eef4fe;color:var(--brand-ink);font-weight:650}
.chips input{position:absolute;opacity:0;pointer-events:none}
.chips label:has(input:focus-visible){outline:2px solid var(--brand);outline-offset:2px}
.add-row{width:100%;height:52px;border:1px dashed var(--line-2);border-radius:var(--r-lg);background:transparent;color:var(--ink-2);font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
.add-row:hover{border-color:var(--ink-3);color:var(--ink);background:rgba(255,255,255,.6)}
.savebar{position:sticky;bottom:16px;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow-lift);padding:12px 14px 12px 18px;margin-top:-80px}
.savebar .st-txt{font-size:13.5px;color:var(--ink-2);display:flex;align-items:center;gap:8px}
.savebar .st-txt i{width:8px;height:8px;border-radius:50%;background:var(--ink-3)}
.savebar .st-txt.dirty i{background:#e9a514}
.savebar .st-txt.ok i{background:var(--s-tally)}
.savebar .btns{display:flex;gap:8px}
.res-tbl td{vertical-align:top}
.res-tbl tr.cont td.who{color:transparent}
.miss{margin-top:20px}
.miss summary{cursor:pointer;font-size:14px;font-weight:650;padding:6px 0}
.miss .names{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.miss .names span{font-size:13px;background:var(--sunken);border:1px solid var(--line);border-radius:999px;padding:3px 10px;color:var(--ink-2)}
.preset{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}

/* 학습자료 */
.mats{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.mat{position:relative;display:flex;flex-direction:column;padding:20px}
.mat:hover{border-color:var(--line-2)}
.mat .kind{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;color:var(--ink-2)}
.mat .kind svg.i{width:15px;height:15px;color:var(--k)}
.mat h3{margin:10px 0 6px;font-size:16.5px;font-weight:650;letter-spacing:-.03em}
.mat p{margin:0 0 16px;font-size:14px;color:var(--ink-2)}
.mat .pills{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.pill{font-size:12px;font-weight:600;color:var(--ink-2);background:var(--sunken);border:1px solid var(--line);padding:2px 9px;border-radius:999px}
.mat .foot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;gap:8px;padding-top:14px;border-top:1px solid var(--line)}
.mat .own{position:absolute;top:14px;right:12px}

/* 바로가기 */
.group{margin-bottom:28px}
.group h2{font-size:13px;color:var(--ink-3);font-weight:600;margin:0 0 10px}
.links{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.lk{position:relative;display:flex;align-items:center;gap:12px;padding:12px 14px;text-decoration:none}
.lk:hover{border-color:var(--line-2);box-shadow:var(--shadow-lift)}
.lk .fav{width:32px;height:32px;border-radius:8px;background:var(--sunken);border:1px solid var(--line);display:grid;place-items:center;flex:none;overflow:hidden}
.lk .fav img{width:18px;height:18px}
.lk b{display:block;font-size:14.5px;font-weight:600;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lk small{display:block;font-size:12px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lk .t{min-width:0;flex:1}
.lk-edit{position:absolute;top:8px;right:8px;z-index:2;opacity:0}
.lk-wrap{position:relative}
.lk-wrap:hover .lk-edit,.lk-wrap:focus-within .lk-edit{opacity:1}

/* 회원 관리 */
.section-title{font-size:15px;font-weight:700;letter-spacing:-.02em;margin:0 0 12px;display:flex;gap:8px;align-items:center}
.section-title .c{font-size:13px;font-weight:600;color:var(--ink-3)}
.pend{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;margin-bottom:36px}
.pcard{padding:18px;display:flex;flex-direction:column;gap:2px}
.pcard b{font-size:16px;font-weight:650}
.pcard .btns{display:flex;gap:6px;margin-top:14px}
.tbl-wrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-size:12.5px;color:var(--ink-3);font-weight:600;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--sunken)}
.tbl td{padding:12px 16px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.st{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600}
.st i{width:7px;height:7px;border-radius:50%}
.st.approved i{background:var(--s-tally)}.st.pending i{background:#e9a514}.st.rejected i{background:var(--s-apply)}

/* 대화상자 */
dialog{border:0;border-radius:18px;padding:0;width:min(560px,calc(100vw - 32px));max-height:calc(100vh - 40px);box-shadow:0 30px 80px -20px rgba(23,32,51,.45);color:var(--ink)}
dialog::backdrop{background:rgba(15,22,36,.42);backdrop-filter:blur(2px)}
.dlg-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:24px 26px 4px}
.dlg-head h2{font-size:20px;font-weight:750;letter-spacing:-.035em;margin:0}
.dlg-head .meta{margin-top:2px}
.dlg-body{padding:18px 26px 6px}
.dlg-foot{display:flex;justify-content:flex-end;gap:8px;padding:10px 26px 24px}
.drop{border:1px dashed var(--line-2);border-radius:var(--r);padding:22px;text-align:center;color:var(--ink-3);font-size:14px;cursor:pointer;background:var(--sunken)}
.drop:hover{border-color:var(--ink-3)}
.drop.has{border-style:solid;border-color:var(--brand);color:var(--ink);background:#f3f7fe}
.icons{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.icons button{height:40px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--surface);color:var(--ink-2);cursor:pointer;display:grid;place-items:center}
.icons button:hover{border-color:var(--line-2);color:var(--ink)}
.icons button[aria-pressed="true"]{border-color:var(--ink);color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.temp-pw{font-size:26px;font-weight:700;letter-spacing:.06em;text-align:center;background:var(--sunken);border:1px solid var(--line);border-radius:var(--r);padding:16px;font-variant-numeric:tabular-nums}

.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:10px;font-size:14px;font-weight:500;z-index:99;box-shadow:var(--shadow-lift)}
@media (prefers-reduced-motion:no-preference){.toast{animation:rise .2s ease-out}}
@keyframes rise{from{opacity:0;transform:translate(-50%,8px)}}
.loading{min-height:100vh;display:grid;place-items:center;color:var(--ink-3)}
.demo-flag{position:fixed;right:16px;bottom:16px;background:var(--surface);color:var(--ink-2);border:1px solid var(--line);font-size:12.5px;font-weight:600;padding:7px 12px;border-radius:999px;z-index:50;box-shadow:var(--shadow-lift);display:flex;align-items:center;gap:6px}
.demo-flag i{width:7px;height:7px;border-radius:50%;background:#e9a514}

/* ── 반응형 ── */
@media (max-width:960px){
  .gate{grid-template-columns:1fr}
  .gate-sky{padding:32px 24px 40px;min-height:340px;gap:40px}
  .gate-title{font-size:64px}
  .gate-panel{padding:36px 20px 56px}
  .portal{grid-template-columns:minmax(0,1fr)}
  .side{min-width:0}
  .side{position:sticky;top:0;z-index:30;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;padding:12px 16px 0;border-right:0;border-bottom:1px solid var(--line)}
  .brand{padding:0;flex:1}
  .brand small{display:none}
  .nav-cap,.nav-gap,.side-fill{display:none}
  .me{order:2;border:0;padding:0}
  .me-txt{display:none}
  .pop{bottom:auto;top:40px}
  .tabs{order:3;width:100%;flex-direction:row;overflow-x:auto;gap:2px;margin-top:10px;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{flex:none;height:42px;border-radius:0;padding:0 12px;border-bottom:2px solid transparent}
  .tab[aria-current="page"]{background:transparent;border-bottom-color:var(--ink)}
  .tab .n{display:none}
  .tab .alert{margin-left:2px}
  .main{padding:26px 16px 56px}
  .head h1{font-size:26px}
  .search{width:100%}
  .head .btn{width:100%}
  .head>div:last-child{width:100%}
  .ticket{grid-template-columns:1fr}
  .ticket .stub{border-left:0;border-top:1px dashed var(--line-2);display:grid;grid-template-columns:auto 1fr;align-items:center;gap:8px 18px}
  .ticket .stub .cap,.ticket .stub .bar{grid-column:2}
  .ticket .stub .dday{grid-row:1 / span 2}
  .ticket .stub .act{grid-column:1 / -1}
  .row2{grid-template-columns:1fr}
  .tbl .hide-m{display:none}
  .app .own,.lk-edit{opacity:1}
}
</style>

<script>
/* ══════════════════════════════════════════════
   설정: Apps Script 웹 앱 URL을 붙여넣으세요.
   비워 두면 체험용(데모) 모드로 열립니다.
   ══════════════════════════════════════════════ */
const API_URL = 'https://script.google.com/macros/s/AKfycbxtlPvs4osmX2bs_gFRwKdAra565keCxp07VUKiVPs4zh3cLV42GfbMvO07gScqlkc/exec';

const DEMO = !API_URL;
const app = document.getElementById('app');
const dlg = document.getElementById('dlg');

/* 메뉴 순서는 여기 적힌 순서대로 나옵니다 */
const SECTIONS = {
  admin: { label: '행정 지원', color: 'var(--s-admin)', add: '웹앱 등록',
    desc: '학교에서 만든 업무용 웹앱을 모았습니다. 누르면 새 창에서 열립니다.' },
  learn: { label: '학습자료', color: 'var(--s-learn)', add: '자료 올리기',
    desc: '수업용 웹앱과 자료를 학년·교과별로 나눕니다. 올린 파일은 학교 구글 드라이브에 저장됩니다.' },
  room: { label: '실 예약', color: 'var(--s-room)', noPosts: true,

/* ───────── 도우미 ───────── */
function store(k, v) {
  try { if (v === undefined) return localStorage.getItem(k); if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) { return null; }
}
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function safeUrl(u) { return /^https?:\/\//i.test(u || '') ? u : '#'; }
function fmtDate(iso) { if (!iso) return ''; const d = new Date(iso); return isNaN(d) ? '' : `${d.getMonth() + 1}월 ${d.getDate()}일`; }
function dday(dateStr) {
  if (!dateStr) return null;
  const t = new Date(); t.setHours(0, 0, 0, 0);
  const d = new Date(dateStr + 'T00:00:00');
  return Math.round((d - t) / 86400000);
}
function toast(msg) {
  document.querySelectorAll('.toast').forEach(t => t.remove());
  const el = document.createElement('div'); el.className = 'toast'; el.setAttribute('role', 'status'); el.textContent = msg;
  document.body.appendChild(el); setTimeout(() => el.remove(), 2600);
}
function host(u) { try { return new URL(u).hostname.replace(/^www\./, ''); } catch (e) { return ''; } }
function canEdit(p) { return state.me && (p.authorId === state.me.id || state.me.role === 'admin'); }
function ownBtns(p) {

}
function sizeText(n) { if (!n) return ''; return n > 1048576 ? (n / 1048576).toFixed(1) + 'MB' : Math.ceil(n / 1024) + 'KB'; }

/* ───────── 비밀번호 칸 ─────────
   PC의 비밀번호 칸은 한글 입력이 막혀 있어서, 한글 자판으로 친 글자가 영문으로 들어갑니다(하늘쌤 → gksmfToa).
   휴대폰은 한글이 그대로 들어가 기기마다 비밀번호가 달라지므로, 새 비밀번호는 영문·숫자·기호만 받습니다. */
const HANGUL_RE = /[ㄱ-ㆎ가-힣]/;
function pwRule(pw) {
  if (/[^\x21-\x7E]/.test(pw)) return '비밀번호는 영문, 숫자, 기호로만 만들어 주세요. 한글과 띄어쓰기는 쓸 수 없습니다.';
  if (pw.length < 8) return '비밀번호는 8자 이상으로 정해 주세요.';
  return '';
}
function pwField(name, label, small, ac) {
  return `<label class="f"><span>${label}${small ? `<small>${small}</small>` : ''}</span>
    <span class="pw"><input class="in" name="${name}" type="password" autocomplete="${ac}" autocapitalize="off" autocorrect="off" spellcheck="false" data-pw>
    <button type="button" class="pw-eye" data-act="pwEye" aria-label="${label} 보기">보기</button></span>
    <span class="pw-hint" hidden></span></label>`;
}
function pwCheck(e) {
  const inp = e.target; if (!inp.matches || !inp.matches('input[data-pw]')) return;
  const hint = inp.closest('label').querySelector('.pw-hint'); if (!hint) return;
  const caps = e.getModifierState && e.getModifierState('CapsLock');
  const msg = HANGUL_RE.test(inp.value) ? '한글이 입력되고 있습니다. 비밀번호는 영문으로 입력해 주세요.'
    : caps ? 'Caps Lock(대문자 고정)이 켜져 있습니다.' : '';
  hint.textContent = msg; hint.hidden = !msg;
}
document.addEventListener('input', pwCheck);
document.addEventListener('keyup', pwCheck);

/* ───────── 서버 통신 ───────── */
async function api(action, payload = {}) {
  const body = Object.assign({ action, token: state.token }, payload);
  let res;
  try {
    if (DEMO) res = await Mock.call(body);
    else {
      const r = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) });
      res = await r.json();
    }
  } catch (e) {
    throw new Error('서버에 연결하지 못했습니다. 인터넷 연결과 API 주소를 확인해 주세요.');
  }
  if (!res.ok) {
    if (res.code === 'LOGIN' && action !== 'login') { clearSession(); render(); }
    throw new Error(res.message);
  }
  return res.data;
}
function clearSession() { state.token = null; state.me = null; store('hm_token', null); }

async function load() {
  const d = await api('bootstrap');
  Object.assign(state, { me: d.me, posts: d.posts, applyCounts: d.applyCounts || {}, applyFull: d.applyFull || {}, myApplies: d.myApplies || {}, pendingCount: d.pendingCount || 0,
    tallyCounts: d.tallyCounts || {}, myTallies: d.myTallies || {}, rooms: d.rooms || [] });
}

async function onGateSubmit(e) {
  e.preventDefault();
  const fd = Object.fromEntries(new FormData(e.target));
  const btn = e.target.querySelector('button[type=submit]');
  const login = state.gateTab === 'login';
  if (!fd.name.trim() || !fd.password) return renderGateKeep({ text: '이름과 비밀번호를 모두 입력해 주세요.' }, fd);
  if (!login && fd.password !== fd.password2) return renderGateKeep({ text: '비밀번호 확인이 일치하지 않습니다.' }, fd);
  if (!login) { const bad = pwRule(fd.password); if (bad) return renderGateKeep({ text: bad }, fd); }
  btn.disabled = true; btn.textContent = login ? '확인하는 중…' : '보내는 중…';
  try {
    if (login) {
      const r = await api('login', { name: fd.name, password: fd.password });
      if (r.status === 'pending') { renderWait(r.name); return; }
      state.token = r.token; store('hm_token', r.token);
      await load(); render();
    } else {
      await api('register', { name: fd.name, dept: fd.dept, password: fd.password });
      state.gateTab = 'login';
      renderGate({ ok: true, text: '가입 신청을 보냈습니다. 관리자가 승인하면 로그인할 수 있습니다.' });
      app.querySelector('input[name=name]').value = fd.name;
    }
  } catch (err) {
    renderGateKeep({ text: err.message }, fd);
  }
}
function renderGateKeep(message, fd) {
  renderGate(message);
  ['name', 'dept'].forEach(k => { const el = app.querySelector(`input[name=${k}]`); if (el && fd[k]) el.value = fd[k]; });
}

    </main>
  </div>
  ${DEMO ? '<div class="demo-flag"><i></i>체험용 화면</div>' : ''}`;
  if (state.tv && v === 'tally') { renderTallyView(); return; }
  const q = document.getElementById('q');
  if (q) q.addEventListener('input', () => { state.q = q.value; renderList(); });
  renderFilters(); renderList();
}

function segBtn(group, value, cur, label) { return `<button data-act="filter" data-g="${group}" data-v="${esc(value)}" aria-pressed="${value === cur}">${esc(label || value)}</button>`; }

function renderFilters() {
  const el = document.getElementById('filters'); if (!el) return;
  const f = state.f;
  if (state.view === 'admin') el.innerHTML = `<div class="seg">${['전체', ...Object.keys(ADMIN_TAGS)].map(t => segBtn('adminTag', t, f.adminTag)).join('')}</div>`;
  else if (state.view === 'learn') el.innerHTML =
    `<div class="seg">${['전체', ...GRADES].map(g => segBtn('grade', g, f.grade, g.replace('학년', ''))).join('')}</div>` +
    `<select data-act="subject" aria-label="교과"><option value="전체">모든 교과</option>${SUBJECTS.map(s => `<option ${s === f.subject ? 'selected' : ''}>${s}</option>`).join('')}</select>` +
    `<select data-act="kind" aria-label="자료 종류"><option value="전체">모든 종류</option>${Object.entries(KINDS).map(([k, o]) => `<option value="${k}" ${k === f.kind ? 'selected' : ''}>${o.label}</option>`).join('')}</select>`;
  else el.innerHTML = '';
}

function filtered(board) {
  const q = state.q.trim().toLowerCase();
  return state.posts.filter(p => p.board === board).filter(p => !q || (p.title + ' ' + p.body + ' ' + p.authorName).toLowerCase().includes(q));
}

function emptyBox(title, text) {
  const S = SECTIONS[state.view];
  return `<div class="empty"><b>${title}</b>${text}${S.add && !state.q.trim() ? `<br><button class="btn line" data-act="new">${ic('plus')}${S.add}</button>` : ''}</div>`;
}

function renderList() {
  const el = document.getElementById('list');
  const v = state.view;
  if (v === 'users') return renderUsers(el);
  if (v === 'plan') return renderPlan(el);
  if (v === 'room') return renderRoom(el);
  if (v === 'roomcfg') return renderRoomCfg(el);
  let items = filtered(v);
  const searching = state.q.trim();
  if (v === 'admin') {
    if (state.f.adminTag !== '전체') items = items.filter(p => (p.extra.tag || '기타') === state.f.adminTag);
    el.innerHTML = items.length ? `<div class="apps">${items.map(appTile).join('')}</div>`
      : emptyBox(searching ? '찾는 웹앱이 없습니다' : '등록된 웹앱이 없습니다', searching ? '다른 낱말로 찾아보세요.' : '학교에서 만든 업무용 웹앱 주소를 등록하면 모두가 여기서 엽니다.');
  } else if (v === 'apply') {
    items.sort((a, b) => {
      const da = dday(a.extra.deadline), db = dday(b.extra.deadline);
      const ca = da !== null && da < 0, cb = db !== null && db < 0;
      if (ca !== cb) return ca ? 1 : -1;
      return (da ?? 9999) - (db ?? 9999);
    });
    el.innerHTML = items.length ? `<div class="tickets">${items.map(ticket).join('')}</div>`
      : emptyBox(searching ? '찾는 신청이 없습니다' : '진행 중인 신청이 없습니다', searching ? '다른 낱말로 찾아보세요.' : '연수, 협의실 예약, 동아리 모집처럼 선생님들께 받을 신청을 올려 보세요.');
  } else if (v === 'tally') {
    el.innerHTML = items.length ? `<div class="card rows">${items.map(tallyRow).join('')}</div>`
      : emptyBox(searching ? '찾는 집계가 없습니다' : '진행 중인 집계가 없습니다', searching ? '다른 낱말로 찾아보세요.' : '반별 인원, 참석 여부, 학생 명단처럼 모을 내용을 올려 보세요. 사이트에서 바로 받거나 구글 시트로 받을 수 있습니다.');
  } else if (v === 'learn') {
    const f = state.f;
    items = items.filter(p => (f.grade === '전체' || p.extra.grade === f.grade) && (f.subject === '전체' || p.extra.subject === f.subject) && (f.kind === '전체' || p.extra.kind === f.kind));
    el.innerHTML = items.length ? `<div class="mats">${items.map(matCard).join('')}</div>`
      : emptyBox('조건에 맞는 자료가 없습니다', '학년·교과 선택을 바꾸거나 새 자료를 올려 보세요.');
  } else if (v === 'link') {
    const groups = {};
    items.forEach(p => { const g = p.extra.group || '기타'; (groups[g] = groups[g] || []).push(p); });
    const names = Object.keys(groups).sort((a, b) => a === '기타' ? 1 : b === '기타' ? -1 : a.localeCompare(b, 'ko'));
    el.innerHTML = names.length ? names.map(g => `<div class="group"><h2>${esc(g)}</h2><div class="links">${groups[g].map(linkTile).join('')}</div></div>`).join('')
      : emptyBox('바로가기가 없습니다', '교육청, 업무 시스템처럼 자주 가는 사이트를 추가해 보세요.');
  }
}

function appIcon(icon) { return P[icon] && APP_ICONS.includes(icon) ? ic(icon) : `<span>${esc(icon || '')}</span>` || ic('school'); }

// 포털에 올린 HTML 웹앱은 Apps Script 주소 + ?app=파일ID 로 엽니다
// 올린 HTML 웹앱은 포털 주소 + ?app=파일ID 로 엽니다(구글 주소로 직접 열면 계정 여러 개 로그인 시 오류가 나기 때문)
function appUrl(id) { return location.href.split(/[?#]/)[0] + '?app=' + encodeURIComponent(id); }
function postUrl(p) { return p.extra && p.extra.appFileId ? appUrl(p.extra.appFileId) : p.url; }
function openHref(p) { const u = postUrl(p); return /^file:/.test(u) ? u : safeUrl(u); }

function appTile(p) {
  const tag = p.extra.tag || '기타';
  return `<div class="card app" style="--t:${ADMIN_TAGS[tag] || ADMIN_TAGS['기타']}">
    <a class="cover" href="${esc(openHref(p))}" target="_blank" rel="noopener" aria-label="${esc(p.title)} 새 창에서 열기"></a>
    <div class="ico">${p.extra.icon ? appIcon(p.extra.icon) : ic('school')}</div>
    <h3>${esc(p.title)}${ic('out')}</h3>
    <p>${esc(p.body)}</p>
    <div class="foot"><span class="tag"><i></i>${esc(tag)}</span><span class="meta">${p.extra.appFileId ? '<span class="pill">HTML</span> ' : ''}${esc(p.authorName)}</span></div>
    ${ownBtns(p)}
  </div>`;
}

const FTYPES = { short: '짧은 답', long: '긴 답', number: '숫자', date: '날짜', one: '보기 중 하나', many: '보기 중 여러 개' };
function applyFields(extra) {
  if (Array.isArray(extra.fields) && extra.fields.length) return extra.fields;
  return extra.memoLabel ? [{ id: 'memo', label: extra.memoLabel, type: 'short', options: [], required: false }] : [];
}
function ansText(f, v) { return Array.isArray(v) ? v.join(', ') : (v ?? ''); }

function ticket(p) {
  const d = dday(p.extra.deadline);
  const closed = d !== null && d < 0;
  const manage = canEdit(p);
  const cnt = state.applyCounts[p.id] || 0;
  const cap = Number(p.extra.capacity || 0);
  const full = manage ? (cap > 0 && cnt >= cap) : !!state.applyFull[p.id];
  const mine = p.id in state.myApplies;
  const nFields = applyFields(p.extra).length;
  const ddayText = d === null ? '상시' : closed ? '마감' : d === 0 ? 'D-day' : `D-${d}`;
  const ddayCls = closed || d === null ? 'closed' : d <= 3 ? 'urgent' : '';
  const sub = d === null ? '마감일 없음' : closed ? `${fmtDate(p.extra.deadline)} 마감됨` : `${fmtDate(p.extra.deadline)}까지`;
  let action;
  if (mine) action = `<span class="applied">${ic('check')}신청함</span>${closed ? '' : `${nFields ? `<button class="txt" data-act="apply" data-id="${p.id}">내 신청 고치기</button>` : ''}<button class="txt" data-act="cancelApply" data-id="${p.id}">취소</button>`}`;
  else if (closed) action = `<button class="btn sm line" disabled>마감되었습니다</button>`;
  else if (full) action = `<button class="btn sm line" disabled>정원이 찼습니다</button>`;
  else action = `<button class="btn sm" data-act="apply" data-id="${p.id}">신청하기</button>`;
  const capLine = manage
    ? `<div class="cap"><span>신청 인원</span><span>${cap ? `${cnt} / ${cap}명` : `${cnt}명`}</span></div>${cap ? `<div class="bar ${full ? 'full' : ''}"><i style="width:${Math.min(100, cnt / cap * 100)}%"></i></div>` : ''}`
    : `<div class="cap"><span>${cap ? `정원 ${cap}명` : '인원 제한 없음'}</span></div>`;
  return `<article class="card ticket">
    <div class="main-col">
      <h3>${esc(p.title)}</h3>
      ${p.body ? `<p class="body">${esc(p.body)}</p>` : ''}
      <div class="meta">${esc(p.authorName)} · ${fmtDate(p.createdAt)}에 올림${nFields ? ` · 신청 항목 ${nFields}개` : ''}</div>
      ${(p.url || manage) ? `<div class="acts">
        ${p.url ? `<a class="btn sm line" href="${esc(safeUrl(p.url))}" target="_blank" rel="noopener">참고 자료</a>` : ''}
        ${manage ? `<button class="btn sm line" data-act="applicants" data-id="${p.id}">${ic('users')}신청 현황</button>` : ''}
        ${ownBtns(p)}
      </div>` : ''}
    </div>
    <div class="stub">
      <div class="dday ${ddayCls}">${ddayText}<small>${sub}</small></div>
      ${capLine}
      <div class="act" style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">${action}</div>
    </div>
  </article>`;
}

function tallyRow(p) {
  const d = dday(p.extra.due), closed = d !== null && d < 0;
  const sheet = p.extra.source === 'sheet';
  const ready = sheet || (Array.isArray(p.extra.fields) && p.extra.fields.length > 0);
  const manage = canEdit(p);
  const due = p.extra.due ? `<span class="due ${d !== null && d >= 0 && d <= 3 ? 'soon' : ''}">${ic('clock')}${fmtDate(p.extra.due)}까지${d !== null && d >= 0 ? ` (D-${d})` : ' (끝남)'}</span>` : '';
  const mine = state.myTallies[p.id];
  const cnt = state.tallyCounts[p.id] || 0;
  let btns = '';
  if (!ready) btns = manage ? `<span class="meta">고치기에서 입력 항목을 다시 만들어 주세요</span>` : `<span class="meta">준비 중</span>`;
  else if (sheet) {
    // 구글 시트 방식: 시트로 가서 입력하고, 포털에서 '입력 완료'를 눌러 알립니다
    if (manage) btns += `<button class="btn sm line" data-act="tallyResults" data-id="${p.id}">${ic('chart')}완료 현황</button>`;
    if (!closed) btns += mine ? `<button class="btn sm line" data-act="sheetUndone" data-id="${p.id}">완료 취소</button>` : `<button class="btn sm line" data-act="sheetDone" data-id="${p.id}">${ic('check')}입력 완료</button>`;
    btns += `<a class="btn sm" href="${esc(safeUrl(p.url))}" target="_blank" rel="noopener">${ic('out')}구글 시트에서 입력</a>`;
  } else {
    if (manage) btns += `<button class="btn sm line" data-act="tallyResults" data-id="${p.id}">${ic('chart')}결과 보기</button>`;
    btns += mine ? `<button class="btn sm ${closed ? 'line' : ''}" data-act="tallyOpen" data-id="${p.id}">${closed ? '내 입력 보기' : '내 입력 고치기'}</button>`
      : closed ? `<button class="btn sm line" disabled>기한이 지났습니다</button>` : `<button class="btn sm" data-act="tallyOpen" data-id="${p.id}">입력하기</button>`;
  }
  return `<article class="trow">
    <div class="top">
      <div>
        <h3>${esc(p.title)}</h3>
        <div class="meta">${ready ? `<span class="pill">${sheet ? '구글 시트' : '사이트 입력'}</span> ` : ''}${due ? due + ' · ' : ''}${ready ? `<span class="num">${cnt}명 ${sheet ? '완료' : '제출'}</span> · ` : ''}${esc(p.authorName)} · ${fmtDate(p.createdAt)}</div>
        ${mine ? `<div class="done" style="margin-top:6px">${ic('check')}${fmtDate(mine.at)}에 ${sheet ? '입력 완료' : '제출함'}${!sheet && p.extra.mode === 'multi' ? ` (${mine.rows.length}줄)` : ''}</div>` : ''}
      </div>
      <div class="btns">${ownBtns(p)}${btns}</div>
    </div>
    ${p.body ? `<p class="body">${esc(p.body)}</p>` : ''}
  </article>`;
}

function matCard(p) {
  const k = KINDS[p.extra.kind] || KINDS.link;
  const openLabel = p.extra.kind === 'webapp' ? '웹앱 열기' : p.extra.kind === 'file' ? '파일 열기' : '열기';
  return `<article class="card mat" style="--k:${k.color}">
    <span class="kind">${ic(k.icon)}${k.label}</span>
    <h3>${esc(p.title)}</h3>
    ${p.body ? `<p>${esc(p.body)}</p>` : ''}
    <div class="pills"><span class="pill">${esc(p.extra.grade || '공통')}</span><span class="pill">${esc(p.extra.subject || '기타')}</span>${p.extra.fileName ? `<span class="pill">${sizeText(p.extra.size)}</span>` : ''}</div>
    <div class="foot">
      <span class="meta">${esc(p.authorName)} · ${fmtDate(p.createdAt)}</span>
      ${postUrl(p) ? `<a class="btn sm line" href="${esc(openHref(p))}" target="_blank" rel="noopener">${openLabel}</a>` : ''}
    </div>
    ${ownBtns(p)}
  </article>`;
}

function linkTile(p) {
  const h = host(p.url);
  return `<div class="lk-wrap">
    <a class="card lk" href="${esc(safeUrl(p.url))}" target="_blank" rel="noopener">
      <span class="fav"><img src="https://www.google.com/s2/favicons?domain=${encodeURIComponent(h)}&sz=64" alt="" loading="lazy" onerror="this.remove()"></span>
      <span class="t"><b>${esc(p.title)}</b><small>${esc(h)}</small></span>
    </a>
    ${canEdit(p) ? `<button class="txt lk-edit" data-act="edit" data-id="${p.id}" aria-label="${esc(p.title)} 고치기">고치기</button>` : ''}
  </div>`;
}

/* ───────── 회원 관리 ───────── */
async function renderUsers(el) {
  if (!state.users) {
    el.innerHTML = '<p class="meta">회원 목록을 불러오는 중…</p>';
    try { state.users = await api('users'); } catch (e) { el.innerHTML = `<div class="msg err">${esc(e.message)}</div>`; return; }
  }
  const pend = state.users.filter(u => u.status === 'pending');
  const statusLabel = { approved: '승인됨', pending: '승인 대기', rejected: '접속 막힘' };
  el.innerHTML = `
    <h2 class="section-title">승인 기다리는 신청<span class="c">${pend.length}건</span></h2>
    ${pend.length ? `<div class="pend">${pend.map(u => `<div class="card pcard">
      <b>${esc(u.name)}</b><span class="meta">${esc(u.dept || '소속 미입력')} · ${fmtDate(u.createdAt)} 신청</span>
      <div class="btns"><button class="btn sm ok" data-act="setUser" data-id="${u.id}" data-status="approved">${ic('check')}승인</button>
      <button class="btn sm danger" data-act="setUser" data-id="${u.id}" data-status="rejected">거절</button></div></div>`).join('')}</div>`
      : `<p class="meta" style="margin:0 0 36px">새 가입 신청이 없습니다.</p>`}
    <h2 class="section-title">전체 회원<span class="c">${state.users.length}명</span></h2>
    <div class="card tbl-wrap"><table class="tbl">
      <thead><tr><th>이름</th><th class="hide-m">소속</th><th>상태</th><th>권한</th><th class="hide-m">마지막 접속</th><th></th></tr></thead>
      <tbody>${state.users.map(u => {
        const self = u.id === state.me.id;
        return `<tr><td><b style="font-weight:600">${esc(u.name)}</b></td><td class="hide-m">${esc(u.dept)}</td>
        <td><span class="st ${u.status}"><i></i>${statusLabel[u.status] || u.status}</span></td>
        <td>${u.role === 'admin' ? '관리자' : '교사'}</td><td class="hide-m meta">${fmtDate(u.lastLogin) || '-'}</td>
        <td style="text-align:right;white-space:nowrap">${self ? '<span class="meta">내 계정</span>' : `
          ${u.status !== 'approved' ? `<button class="txt" data-act="setUser" data-id="${u.id}" data-status="approved">승인</button>` : `<button class="txt" data-act="setUser" data-id="${u.id}" data-status="rejected">접속 막기</button>`}
          <button class="txt" data-act="setUser" data-id="${u.id}" data-role="${u.role === 'admin' ? 'teacher' : 'admin'}">${u.role === 'admin' ? '관리자 해제' : '관리자로 지정'}</button>
          <button class="txt" data-act="resetPw" data-id="${u.id}">비밀번호 초기화</button>`}</td></tr>`;
      }).join('')}</tbody></table></div>`;
}

/* ───────── 대화상자 ───────── */
function openDialog(html) {
  dlg.classList.remove('wide');
  dlg.innerHTML = html; if (!dlg.open) dlg.showModal();
  const first = dlg.querySelector('input:not([type=hidden]):not([type=file]),textarea,select'); if (first) first.focus();
}
function closeDialog() { if (dlg.open) dlg.close(); dlg.innerHTML = ''; dlg.classList.remove('wide'); }
function dlgHead(title, sub) { return `<div class="dlg-head"><div><h2>${title}</h2>${sub ? `<div class="meta">${sub}</div>` : ''}</div></div>`; }

function postForm(board, p) {
  const e = p ? p.extra : {};
  const v = (x) => esc(x ?? '');
  const today = new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 10);
  let fields = '';
  // 웹앱 연결 방법: 주소 입력 / HTML 파일 올리기
  const src = e.appFileId ? 'html' : 'url';
  const srcBlock = `
    <fieldset class="f" style="margin-bottom:14px"><legend>웹앱 연결 방법</legend><div class="chips">
      <label><input type="radio" name="src" value="url" data-act="srcSel" ${src === 'url' ? 'checked' : ''}>주소 입력</label>
      <label><input type="radio" name="src" value="html" data-act="srcSel" ${src === 'html' ? 'checked' : ''}>HTML 파일 올리기</label></div></fieldset>
    <div id="srcUrl" ${src === 'html' ? 'hidden' : ''}><label class="f"><span>주소</span><input class="in" name="url" type="url" value="${src === 'url' && (board === 'admin' || e.kind === 'webapp' || !e.kind) ? v(p?.url) : ''}" placeholder="https://"></label></div>
    <div id="srcHtml" ${src === 'html' ? '' : 'hidden'}>
      <div class="f" style="margin-bottom:16px"><span class="flabel">HTML 파일<small>5MB까지</small></span>
        <div class="drop ${e.appFileName ? 'has' : ''}" id="appDrop" tabindex="0" role="button">${e.appFileName ? `${esc(e.appFileName)} (${sizeText(e.size)}) · 바꾸려면 누르세요` : '눌러서 .html 파일을 고르거나 여기로 끌어 놓으세요'}</div>
        <input type="file" id="appIn" accept=".html,.htm,text/html" hidden>
        <p class="hint" style="margin:8px 0 0">올리면 바로 열리는 주소가 만들어집니다. CSS·자바스크립트가 파일 안에 들어 있는 한 파일짜리 웹앱이어야 하고, 그림 파일을 따로 쓰는 웹앱은 주소 입력을 쓰세요.</p></div></div>`;
  if (board === 'admin') {
    const curIcon = APP_ICONS.includes(e.icon) ? e.icon : 'school';
    fields = `
    <label class="f"><span>웹앱 이름</span><input class="in" name="title" required maxlength="80" value="${v(p?.title)}" placeholder="방문객 출입기록"></label>
    ${srcBlock}
    <label class="f"><span>한 줄 설명</span><input class="in" name="body" maxlength="140" value="${v(p?.body)}" placeholder="QR로 방문객 출입을 기록합니다"></label>
    <label class="f" style="max-width:240px"><span>업무 분류</span><select class="in" name="tag">${Object.keys(ADMIN_TAGS).map(t => `<option ${t === (e.tag || '기타') ? 'selected' : ''}>${t}</option>`).join('')}</select></label>
    <div class="f" style="margin-bottom:16px"><span class="flabel">아이콘</span>
      <input type="hidden" name="icon" value="${curIcon}">

    form._fields = JSON.parse(JSON.stringify(applyFields(e)));

  }
  if (board === 'tally') {
    form._fields = JSON.parse(JSON.stringify(Array.isArray(e.fields) ? e.fields : []));
    renderFields(form);
  }
  form._app = null;
  form._existingApp = e.appFileId ? { appFileId: e.appFileId, appFileName: e.appFileName, size: e.size, url: p.url } : null;
  setupDrop(form, 'drop', 'fileIn', (file) => {
    if (file.size > 20 * 1048576) return '20MB 이하 파일만 올릴 수 있습니다.';
    form._file = file;
  });
  setupDrop(form, 'appDrop', 'appIn', (file) => {
    if (!/\.html?$/i.test(file.name)) return '.html 파일만 올릴 수 있습니다.';
    if (file.size > 5 * 1048576) return '5MB 이하 HTML 파일만 올릴 수 있습니다.';
    form._app = file;
  });
}
// 파일 끌어 놓기·고르기 상자
function setupDrop(form, dropId, inputId, accept) {
  const drop = document.getElementById(dropId), input = document.getElementById(inputId);
  if (!drop) return;
  const pick = (file) => {
    if (!file) return;
    const err = accept(file);
    if (err) { formMsg(err); return; }
    document.getElementById('formMsg').innerHTML = '';
    drop.classList.add('has'); drop.textContent = `${file.name} (${sizeText(file.size)})`;
    const t = form.querySelector('[name=title]'); if (!t.value) t.value = file.name.replace(/\.[^.]+$/, '');
  };
  drop.addEventListener('click', () => input.click());
  drop.addEventListener('keydown', ev => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); input.click(); } });
  drop.addEventListener('dragover', ev => { ev.preventDefault(); });
  drop.addEventListener('drop', ev => { ev.preventDefault(); pick(ev.dataTransfer.files[0]); });
  input.addEventListener('change', () => pick(input.files[0]));
}
function formMsg(t) { const el = document.getElementById('formMsg'); if (el) el.innerHTML = `<div class="msg err" role="alert">${esc(t)}</div>`; }

function readBase64(file) {
  return new Promise((ok, no) => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(',')[1]); r.onerror = () => no(new Error('파일을 읽지 못했습니다.')); r.readAsDataURL(file); });
}

async function submitPost(form, board, p) {
  const fd = Object.fromEntries(new FormData(form));
  const btn = form.querySelector('button[type=submit]');
  if (!String(fd.title || '').trim()) return formMsg('제목을 입력해 주세요.');
  const extra = {};
  let url = (fd.url || '').trim();
  const webapp = board === 'admin' || (board === 'learn' && fd.kind === 'webapp');
  const htmlSrc = webapp && fd.src === 'html';
  if (webapp) {
    if (htmlSrc) {
      if (!form._app && !form._existingApp) return formMsg('올릴 HTML 파일을 골라 주세요.');
      if (!form._app) { Object.assign(extra, { appFileId: form._existingApp.appFileId, appFileName: form._existingApp.appFileName, size: form._existingApp.size }); url = form._existingApp.url || ''; }
    } else if (!url) return formMsg('웹앱 주소를 입력해 주세요.');
  }
  if (board === 'admin') { extra.tag = fd.tag; extra.icon = fd.icon; }
  const tallySheet = board === 'tally' && fd.source === 'sheet';
  if (board === 'apply' || (board === 'tally' && !tallySheet)) {
    syncFields(form);
    const fields = form._fields.map(f => ({ ...f, label: f.label.trim(), options: (f.type === 'one' || f.type === 'many') ? f.options.map(o => o.trim()).filter(Boolean) : [] }));
    const noLabel = fields.findIndex(f => !f.label);
    if (noLabel >= 0) return formMsg(`${noLabel + 1}번째 항목의 이름을 적어 주세요.`);
    const noOpt = fields.find(f => (f.type === 'one' || f.type === 'many') && !f.options.length);
    if (noOpt) return formMsg(`‘${noOpt.label}’ 항목에 보기를 하나 이상 적어 주세요.`);
    if (board === 'tally' && !fields.length) return formMsg('입력받을 항목을 하나 이상 만들어 주세요.');
    extra.fields = fields;
  }
  if (board === 'apply') { extra.deadline = fd.deadline || ''; extra.capacity = Math.max(0, parseInt(fd.capacity || '0', 10) || 0); }
  if (board === 'tally') {
    extra.due = fd.due || '';
    if (tallySheet) {
      url = (fd.sheetUrl || '').trim();
      if (!/^https:\/\/docs\.google\.com\/spreadsheets\/d\//.test(url)) return formMsg('입력받을 구글 시트 주소를 넣어 주세요. (https://docs.google.com/spreadsheets/d/… 형태)');
      Object.assign(extra, { source: 'sheet', fields: [] });
    } else { Object.assign(extra, { source: 'site', mode: fd.mode === 'multi' ? 'multi' : 'once' }); url = ''; }
  }
  if (board === 'link') { if (!url) return formMsg('주소를 입력해 주세요.'); extra.group = (fd.group || '').trim() || '기타'; }
  if (board === 'learn') {
    Object.assign(extra, { kind: fd.kind, grade: fd.grade, subject: fd.subject });
    if (fd.kind === 'file') {
      if (!form._file && !form._existing?.fileId) return formMsg('올릴 파일을 골라 주세요.');
      if (!form._file) { Object.assign(extra, { fileId: form._existing.fileId, fileName: form._existing.fileName, size: form._existing.size }); url = form._existing.url; }
    } else if (fd.kind === 'link') { url = (fd.linkUrl || '').trim(); if (!url) return formMsg('주소를 입력해 주세요.'); }
  }
  if (url && !/^https?:\/\//i.test(url)) return formMsg('주소는 https:// 로 시작해야 합니다.');
  btn.disabled = true;
  try {
    if (board === 'learn' && fd.kind === 'file' && form._file) {
      btn.textContent = '드라이브에 올리는 중…';
      const up = await api('upload', { name: form._file.name, mimeType: form._file.type, data: await readBase64(form._file) });
      Object.assign(extra, { fileId: up.fileId, fileName: up.name, size: up.size }); url = up.url;
    }
    if (htmlSrc && form._app) {
      btn.textContent = '웹앱 올리는 중…';
      const up = await api('uploadApp', { name: form._app.name, html: await form._app.text() });
      Object.assign(extra, { appFileId: up.fileId, appFileName: up.name, size: up.size });
      url = /^https?:/.test(appUrl(up.fileId)) ? appUrl(up.fileId) : '';
    }
    btn.textContent = '저장하는 중…';
    const saved = await api('savePost', { post: { id: p?.id, board, title: fd.title, body: fd.body || '', url, extra } });
    const i = state.posts.findIndex(x => x.id === saved.id);
    if (i >= 0) state.posts[i] = saved; else state.posts.unshift(saved);
    closeDialog(); renderPortal(); toast(p ? '저장했습니다.' : '올렸습니다.');
  } catch (err) { formMsg(err.message); btn.disabled = false; btn.textContent = p ? '저장' : '올리기'; }
}

/* ───────── 집계: 입력 화면(교사)·결과 화면(작성자·관리자) ─────────
   입력한 내용은 포털에 저장되고, 작성자는 결과 화면에서 복사하거나 엑셀(CSV)로 내려받아 시트에 정리합니다. */
// 학년반 보기: 1~5학년 9반, 6학년 8반 (학급 수가 바뀌면 이 숫자만 고치세요)
const CLASS_COUNTS = [9, 9, 9, 9, 9, 8];
const CLASS_LIST = CLASS_COUNTS.flatMap((n, g) => Array.from({ length: n }, (_, c) => `${g + 1}-${c + 1}`));

function tvPost() { return state.tv && state.posts.find(p => p.id === state.tv.postId); }
function closeTally() { state.tv = null; }
function tvDirty() { return state.tv && state.tv.kind === 'entry' && state.tv.dirty; }

function openTally(id, kind) {
  const p = state.posts.find(x => x.id === id); if (!p) return;
  const mine = state.myTallies[id];
  state.tv = { postId: id, kind, dirty: false, rows: mine ? JSON.parse(JSON.stringify(mine.rows)) : [{}], data: null, error: null };
  renderPortal(); window.scrollTo(0, 0);
  if (kind === 'results') loadResults();
}

function tvHead(p, extraBtns) {
  const d = dday(p.extra.due);
  return `<button class="txt tv-back" data-act="tvBack">← 집계 목록</button>
    <div class="tv-head">
      <div><h1>${esc(p.title)}</h1>
        <div class="meta">${p.extra.due ? `<span class="due ${d !== null && d >= 0 && d <= 3 ? 'soon' : ''}">${ic('clock')}${fmtDate(p.extra.due)}까지${d !== null && d >= 0 ? ` (D-${d})` : ' (끝남)'}</span> · ` : ''}${esc(p.authorName)}${state.tv.kind === 'results' && state.tv.data ? ` · ${state.tv.data.list.length}명 ${state.tv.data.source === 'sheet' ? '입력 완료' : '제출'}` : ''}</div></div>
      <div class="btns">${extraBtns || ''}</div>
    </div>
    ${p.body ? `<p class="tv-body">${esc(p.body)}</p>` : ''}`;
}

function renderTallyView() {
  const p = tvPost(), box = document.getElementById('tallyView');
  if (!box) return;
  if (!p) { closeTally(); renderPortal(); return; }
  if (state.tv.kind === 'results') return renderResults(p, box);
  renderEntry(p, box);
}

/* 입력 화면 */
function entryField(f, i, val) {
  const n = `r${i}_${esc(f.id)}`, star = f.required ? '<span class="req-mark" aria-label="필수">*</span>' : '';
  if (f.type === 'one' && f.options.length > 6) {
    return `<label class="f"><span>${esc(f.label)}${star}</span><select class="in" name="${n}"><option value="">고르세요</option>${f.options.map(o => `<option ${o === val ? 'selected' : ''}>${esc(o)}</option>`).join('')}</select></label>`;
  }
  if (f.type === 'one' || f.type === 'many') {
    const sel = Array.isArray(val) ? val : (val ? [val] : []);
    return `<fieldset class="f wide"><legend>${esc(f.label)}${star}${f.type === 'many' ? '<span class="qhint">여러 개 고를 수 있어요</span>' : ''}</legend><div class="chips">
      ${f.options.map(o => `<label><input type="${f.type === 'one' ? 'radio' : 'checkbox'}" name="${n}" value="${esc(o)}" ${sel.includes(o) ? 'checked' : ''}>${f.type === 'many' ? ic('check') : ''}${esc(o)}</label>`).join('')}</div></fieldset>`;
  }
  const v = esc(val ?? '');
  if (f.type === 'long') return `<label class="f wide"><span>${esc(f.label)}${star}</span><textarea class="in" name="${n}" maxlength="2000" rows="3">${v}</textarea></label>`;
  if (f.type === 'number') return `<label class="f"><span>${esc(f.label)}${star}</span><input class="in" name="${n}" inputmode="decimal" value="${v}"></label>`;
  if (f.type === 'date') return `<label class="f"><span>${esc(f.label)}${star}</span><input class="in" name="${n}" type="date" value="${v}"></label>`;
  return `<label class="f"><span>${esc(f.label)}${star}</span><input class="in" name="${n}" maxlength="300" value="${v}"></label>`;
}

function renderEntry(p, box) {
  const tv = state.tv, fields = p.extra.fields || [], multi = p.extra.mode === 'multi';
  const d = dday(p.extra.due), closed = d !== null && d < 0;
  const mine = state.myTallies[p.id];
  const cards = tv.rows.map((row, i) => `<section class="card entry" data-row="${i}">
      ${multi ? `<div class="entry-top"><b>${i + 1}번째 줄</b>${!closed && tv.rows.length > 1 ? `<button type="button" class="txt" data-act="rowDel" data-i="${i}">이 줄 지우기</button>` : ''}</div>` : ''}
      <div class="efields">${fields.map(f => entryField(f, i, row[f.id])).join('')}</div>
    </section>`).join('');
  const status = tv.dirty ? '<span class="st-txt dirty"><i></i>아직 제출하지 않은 내용이 있습니다</span>'
    : mine ? `<span class="st-txt ok"><i></i>${fmtDate(mine.at)} ${new Date(mine.at).toTimeString().slice(0, 5)}에 제출함</span>`
    : '<span class="st-txt"><i></i>아직 제출하지 않았습니다</span>';
  box.innerHTML = tvHead(p) + `
    ${closed ? '<div class="tv-note">입력 기한이 지나 보기만 할 수 있습니다.</div>' : ''}
    <form id="entryForm" novalidate>
      <fieldset style="border:0;padding:0;margin:0" ${closed ? 'disabled' : ''}>
        <div class="entries">${cards}
          ${multi && !closed ? `<button type="button" class="add-row" data-act="rowAdd">${ic('plus')}줄 추가</button>` : ''}
        </div>
      </fieldset>
      ${closed ? '' : `<div class="savebar">${status}<div class="btns">
        ${mine ? `<button type="button" class="btn line" data-act="tallyDel">제출 취소</button>` : ''}
        <button type="submit" class="btn primary">${mine ? '고쳐서 제출' : '제출하기'}</button></div></div>`}
    </form>`;
  const form = document.getElementById('entryForm');
  form.addEventListener('input', () => markDirty());
  form.addEventListener('change', () => markDirty());
  form.addEventListener('submit', (e) => { e.preventDefault(); submitEntry(p); });
}
function markDirty() {
  const tv = state.tv; if (!tv || tv.dirty) return;
  tv.dirty = true;
  const st = document.querySelector('.savebar .st-txt');
  if (st) { st.className = 'st-txt dirty'; st.innerHTML = '<i></i>아직 제출하지 않은 내용이 있습니다'; }
}
// 화면에 입력된 값을 읽어 state.tv.rows에 담습니다
function readEntry(p) {
  const fd = new FormData(document.getElementById('entryForm'));
  const fields = p.extra.fields;
  state.tv.rows = state.tv.rows.map((_, i) => {
    const row = {};
    fields.forEach(f => {
      const n = `r${i}_${f.id}`;
      row[f.id] = f.type === 'many' ? fd.getAll(n) : String(fd.get(n) ?? '').trim();
    });
    return row;
  });
  return state.tv.rows;
}
const rowEmpty = (row) => Object.values(row).every(v => Array.isArray(v) ? !v.length : !v);

async function submitEntry(p) {
  const fields = p.extra.fields, multi = p.extra.mode === 'multi';
  let rows = readEntry(p);
  if (multi) rows = rows.filter(r => !rowEmpty(r));
  if (!rows.length || rows.every(rowEmpty)) return toast('입력한 내용이 없습니다.');
  for (let i = 0; i < rows.length; i++) {
    for (const f of fields) {
      const v = rows[i][f.id];
      const where = multi ? `${i + 1}번째 줄: ` : '';
      if (f.required && (Array.isArray(v) ? !v.length : !v)) return toast(`${where}‘${f.label}’ 항목을 ${f.type === 'one' || f.type === 'many' ? '골라' : '입력해'} 주세요.`);
      if (v && f.type === 'number' && isNaN(Number(String(v).replace(/,/g, '')))) return toast(`${where}‘${f.label}’에는 숫자만 입력해 주세요.`);
    }
  }
  const btn = document.querySelector('#entryForm [type=submit]'); if (btn) { btn.disabled = true; btn.textContent = '제출하는 중…'; }
  try {
    const had = !!state.myTallies[p.id];
    const r = await api('tallySubmit', { postId: p.id, rows });
    state.myTallies[p.id] = { rows: r.rows, at: r.at };
    if (!had) state.tallyCounts[p.id] = (state.tallyCounts[p.id] || 0) + 1;
    state.tv.rows = JSON.parse(JSON.stringify(r.rows)); state.tv.dirty = false;
    renderTallyView();
    toast(r.updated ? '고쳐서 제출했습니다.' : '제출했습니다.');
  } catch (err) { toast(err.message); if (btn) { btn.disabled = false; btn.textContent = state.myTallies[p.id] ? '고쳐서 제출' : '제출하기'; } }
}

/* 결과 화면 */
async function loadResults() {
  const tv = state.tv; if (!tv) return;
  try {
    const r = await api('tallyResults', { postId: tv.postId });
    if (state.tv !== tv) return;
    tv.data = r; tv.error = null;
  } catch (e) { if (state.tv !== tv) return; tv.error = e.message; }
  renderTallyView();
}
function resultRows(data) {   // 교사별 여러 줄을 한 줄씩 펼칩니다
  const out = [];
  data.list.forEach(s => s.rows.forEach((row, j) => out.push({ name: s.name, dept: s.dept, at: s.at, row, j, n: s.rows.length })));
  return out;
}
function renderResults(p, box) {
  const tv = state.tv;
  const btns = tv.data && tv.data.list.length ? `<button class="btn sm line" data-act="resCopy">${ic('copy')}시트용으로 복사</button>
    <button class="btn sm line" data-act="resCsv">${ic('file')}엑셀(CSV) 내려받기</button>` : '';
  if (tv.error) { box.innerHTML = tvHead(p) + `<div class="msg err">${esc(tv.error)}</div>`; return; }
  if (!tv.data) { box.innerHTML = tvHead(p) + '<p class="meta">결과를 불러오는 중…</p>'; return; }
  if (tv.data.source === 'sheet') return renderSheetStatus(p, box);
  const { fields, list, missing } = tv.data;
  const rows = resultRows(tv.data);
  const multi = tv.data.mode === 'multi';
  // 요약: 보기는 보기별 수, 숫자는 합계
  const sums = fields.map(f => {
    if ((f.type === 'one' || f.type === 'many') && f.options.length <= 12) {   // 학년반처럼 보기가 많은 항목은 요약하지 않습니다
      const c = {}; f.options.forEach(o => c[o] = 0);
      rows.forEach(r => { const v = r.row[f.id]; (Array.isArray(v) ? v : v ? [v] : []).forEach(x => { if (x in c) c[x]++; }); });
      const shown = f.options.filter(o => c[o] > 0);
      if (!shown.length) return '';
      return `<div class="sum"><b>${esc(f.label)}</b>${shown.slice(0, 12).map(o => `<div class="r"><span>${esc(o)}</span><span>${c[o]}${multi ? '건' : '명'}</span></div>`).join('')}${shown.length > 12 ? `<div class="r"><span>그 밖 ${shown.length - 12}개</span><span></span></div>` : ''}</div>`;
    }
    if (f.type === 'number') {
      const vals = rows.map(r => r.row[f.id]).filter(v => v !== '' && v !== undefined && v !== null).map(v => Number(String(v).replace(/,/g, ''))).filter(x => !isNaN(x));
      if (!vals.length) return '';
      const total = vals.reduce((a, b) => a + b, 0);
      return `<div class="sum"><b>${esc(f.label)}</b><div class="r"><span>합계</span><span>${total.toLocaleString('ko-KR')}</span></div><div class="r"><span>입력 ${vals.length}건 평균</span><span>${(Math.round(total / vals.length * 10) / 10).toLocaleString('ko-KR')}</span></div></div>`;
    }
    return '';
  }).join('');
  const table = rows.length ? `<div class="card tbl-wrap"><table class="tbl res-tbl"><thead><tr><th>번호</th><th>이름</th><th>소속</th>${fields.map(f => `<th>${esc(f.label)}</th>`).join('')}<th>제출 시각</th></tr></thead><tbody>
      ${rows.map((r, i) => `<tr class="${r.j > 0 ? 'cont' : ''}"><td class="num">${i + 1}</td><td class="who" style="white-space:nowrap"><b style="font-weight:600">${esc(r.name)}</b></td><td class="who" style="white-space:nowrap">${esc(r.dept)}</td>
        ${fields.map(f => `<td class="ans">${esc(ansText(f, r.row[f.id]))}</td>`).join('')}<td class="meta" style="white-space:nowrap">${r.j === 0 ? `${fmtDate(r.at)} ${new Date(r.at).toTimeString().slice(0, 5)}` : ''}</td></tr>`).join('')}
    </tbody></table></div>` : '<div class="empty"><b>아직 제출한 사람이 없습니다</b>제출이 들어오면 여기에 표로 모입니다.</div>';
  box.innerHTML = tvHead(p, btns + `<button class="btn sm line" data-act="resReload">새로고침</button>`) + `
    ${sums ? `<div class="sumbox">${sums}</div>` : ''}
    ${table}
    ${missing.length ? `<details class="miss"><summary>아직 제출하지 않은 선생님 ${missing.length}명</summary><div class="names">${missing.map(m => `<span>${esc(m.name)}${m.dept ? ` · ${esc(m.dept)}` : ''}</span>`).join('')}</div></details>` : (list.length ? '<p class="done" style="margin-top:16px">' + ic('check') + '모든 선생님이 제출했습니다.</p>' : '')}`;
}
// 구글 시트 방식: 내용은 시트에서 보고, 여기서는 누가 '입력 완료'를 눌렀는지만 봅니다
function renderSheetStatus(p, box) {
  const { list, missing } = state.tv.data;
  const btns = `<a class="btn sm" href="${esc(safeUrl(p.url))}" target="_blank" rel="noopener">${ic('out')}구글 시트 열기</a><button class="btn sm line" data-act="resReload">새로고침</button>`;
  const done = list.slice().sort((a, b) => String(a.at).localeCompare(String(b.at)));

    <p class="hint" style="margin:0 0 14px">입력 내용은 구글 시트에서 확인하세요. 여기에는 선생님들이 포털에서 ‘입력 완료’를 누른 기록만 모입니다.</p>

    </tbody></table></div>` : '<div class="empty"><b>아직 입력 완료를 누른 선생님이 없습니다</b>선생님들이 시트에 입력한 뒤 포털에서 ‘입력 완료’를 누르면 여기에 모입니다.</div>'}
    ${missing.length ? `<details class="miss" open><summary>아직 입력 완료를 누르지 않은 선생님 ${missing.length}명</summary><div class="names">${missing.map(m => `<span>${esc(m.name)}${m.dept ? ` · ${esc(m.dept)}` : ''}</span>`).join('')}</div></details>` : (done.length ? '<p class="done" style="margin-top:16px">' + ic('check') + '모든 선생님이 입력을 마쳤습니다.</p>' : '')}`;
}
function resultTable() {
  const { fields } = state.tv.data;
  return [['번호', '이름', '소속', ...fields.map(f => f.label), '제출 시각'],
    ...resultRows(state.tv.data).map((r, i) => [i + 1, r.name, r.dept, ...fields.map(f => String(ansText(f, r.row[f.id]))), `${new Date(r.at).toLocaleDateString('ko-KR')} ${new Date(r.at).toTimeString().slice(0, 5)}`])];
